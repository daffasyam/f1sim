<html lang="id"><head><meta charset="utf-8">

<style>
:root{--bg:#eceef1;--pn:#fff;--pn2:#e4e7ec;--tx:#15171c;--mu:#59616e;--ac:#e10600;--ln:#cfd3da;--ok:#0f7d43;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101216;--pn:#1a1d24;--pn2:#242832;--tx:#eceef2;--mu:#98a0ad;--ln:#2d323d;--ok:#3ddc84;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101216;--pn:#1a1d24;--pn2:#242832;--tx:#eceef2;--mu:#98a0ad;--ln:#2d323d;--ok:#3ddc84;color-scheme:dark}

*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:960px;margin:0 auto;padding:14px 14px 30px}

.btn{background:var(--ac);color:#fff;border:2px solid var(--ac)}

.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:14px;margin:10px 0}
.up{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tc,.ci{text-align:left;background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-left:7px solid var(--k,var(--ln));border-radius:10px;padding:12px;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:5px}
.tc.on,.ci.on{outline:3px solid var(--ac);background:var(--pn2)}
.ci{border-left-color:var(--ln)}.ci.on{border-left-color:var(--ac)}
.st{display:grid;grid-template-columns:48px 1fr 30px;gap:6px;align-items:center;font-size:12px}
.st i{height:6px;background:var(--pn2);border-radius:3px;overflow:hidden}
.st u{display:block;height:100%;background:var(--k,var(--ac))}

.tabs,.seg{display:flex;gap:6px;overflow-x:auto;margin:10px 0;padding:2px}

.tabs .on,.seg .on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.hd{display:flex;justify-content:space-between;align-items:center;border-left:8px solid var(--k);padding-left:12px}
.big{font-size:24px}.mn{font:700 22px "Chakra Petch",system-ui,sans-serif;color:var(--ok)}
.foot{position:sticky;bottom:0;padding:14px 0 6px;background:linear-gradient(transparent,var(--bg) 35%);text-align:center}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.cnt{font:700 22px "Chakra Petch",sans-serif;margin-right:6px}.cnt.ok{color:var(--ok)}
.sc{overflow-x:auto}
.tb{width:100%;border-collapse:collapse;background:var(--pn);border-radius:10px}
.tb td,.tb th{padding:7px 9px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}
.tb tr.me{background:color-mix(in srgb,var(--ac) 16%,transparent)}
.chip{display:inline-block;width:5px;height:16px;border-radius:2px;margin-right:8px;vertical-align:-3px}
.gn{color:var(--ok)}.rd{color:var(--ac)}
.cal{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.cal span{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--pn2);color:var(--mu)}
.cal .dn{text-decoration:line-through}.cal .cur{background:var(--ac);color:#fff}
.pips{letter-spacing:2px;color:var(--ac)}
.sl{margin:12px 0}.sr{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}.sr input{width:100%;accent-color:var(--ac)}
.sel{outline:3px solid var(--ac)}
.ty{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;font:700 11px system-ui;margin-right:4px}
.ty.S{background:#e10600;color:#fff}.ty.M{background:#f5c400;color:#000}.ty.H{background:#d9d9d9;color:#000}.ty.I{background:#2f9e44;color:#fff}.ty.W{background:#1e6fd9;color:#fff}
.bn{padding:9px;border-radius:8px;text-align:center;font:700 17px "Chakra Petch",sans-serif;background:#f5c400;color:#000;margin:8px 0}.bn.VSC{background:#ffe38a}
textarea{width:100%;margin:8px 0;background:var(--pn2);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px;font:12px monospace}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
#toast.on{opacity:1;transform:translate(-50%,0)}
.facGroup{margin:16px 0 6px}.facGrid,.rdGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.facCard,.rdCard{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:12px;min-width:0}
.facCard .row,.rdCard .row{margin-top:8px}.lvl{letter-spacing:2px;color:var(--ac);white-space:nowrap}
.rdCard select{width:100%;margin:8px 0;padding:9px;border-radius:8px;border:1px solid var(--ln);background:var(--pn2);color:var(--tx);font:inherit}
.progress{height:8px;border-radius:8px;background:var(--pn2);overflow:hidden;margin:8px 0}.progress span{display:block;height:100%;background:var(--ok)}
.effect{font-size:12px;color:var(--mu);line-height:1.5}.tag{display:inline-block;padding:3px 7px;border-radius:5px;background:var(--pn2);font-size:11px;color:var(--mu);margin:2px 3px 2px 0}
details.card{padding:0;overflow:hidden}details.card>summary{cursor:pointer;list-style:none;padding:14px;font-weight:700}details.card>summary::-webkit-details-marker{display:none}details.card>summary:after{content:'＋';float:right;color:var(--mu)}details.card[open]>summary:after{content:'−'}details.card>.detailBody{padding:0 14px 14px}.sessionBlock{margin:12px 0}.sessionBlock h4{font:700 15px 'Chakra Petch',sans-serif;margin:8px 0}.fastest{border-left:5px solid var(--ok);padding:9px 12px;background:var(--pn2);border-radius:7px;margin:8px 0}
.details.card>.detailBody{padding:0 14px 14px}.sessionBlock{margin:12px 0}.sessionBlock h4{font:700 15px 'Chakra Petch',sans-serif;margin:8px 0}.fastest{border-left:5px solid var(--ok);padding:9px 12px;background:var(--pn2);border-radius:7px;margin:8px 0}.strategyPanel{border-left:5px solid var(--ac)}.strategyDriver{border-top:1px solid var(--ln);padding-top:10px;margin-top:10px}.strategyMeta{display:flex;gap:7px;flex-wrap:wrap;margin:5px 0}.strategyMeta span{background:var(--pn2);border-radius:6px;padding:4px 7px;font-size:12px}.wearLine{display:block;height:7px;background:var(--pn2);border-radius:6px;overflow:hidden;min-width:65px;margin:5px 0 2px}.wearLine i{display:block;height:100%;border-radius:6px}.wearCell{min-width:75px}.wearCell small{display:block;font-size:11px}.strategyText{font-size:12px;color:var(--mu);margin-top:5px}.resultControls{display:flex;gap:7px;flex-wrap:wrap}.resultControls button{border-radius:8px}.resultControls button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}.orderBox{margin-top:10px;padding:10px;background:var(--pn2);border-radius:9px}.orderTitle{font-size:12px;font-weight:800;margin:7px 0 4px}.orderGroup{display:flex;gap:5px;flex-wrap:wrap}.orderGroup button{font-size:12px;padding:6px 9px;border-radius:7px}.orderGroup button.selected{background:var(--ac);color:#fff;border-color:var(--ac)}.orderStats{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.orderStats span{background:var(--pn);padding:4px 7px;border-radius:6px;font-size:11px}
@media(max-width:520px){.facGrid,.rdGrid{grid-template-columns:1fr}.up{align-items:flex-start}.facCard .up{align-items:center}}

/* Driver market, profile and persistent race controls */
.marketGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.marketCard{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:12px;min-width:0}
.marketCard .meta{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0}
.marketCard .meta span{font-size:12px;background:var(--pn2);border-radius:6px;padding:4px 7px}
.avail{font-size:11px;border-radius:6px;padding:3px 7px;background:var(--pn2);display:inline-block}
.avail.free{background:#d8f1e3;color:#075d32}.avail.locked{background:#fbe5d9;color:#843a12}
.profileHero{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center}
.profileOvr{width:100px;height:100px;border-radius:14px;background:var(--pn2);display:grid;place-items:center;font:700 38px 'Chakra Petch',sans-serif;color:var(--ac)}
.skillRow{display:grid;grid-template-columns:120px 1fr 32px;gap:8px;align-items:center;margin:8px 0;font-size:13px}
.skillRow i{display:block;height:8px;background:var(--pn2);border-radius:8px;overflow:hidden}.skillRow u{display:block;height:100%;background:var(--ac);text-decoration:none}
.raceDock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--pn) 95%,transparent);border-top:1px solid var(--ln);box-shadow:0 -6px 22px #0002;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));backdrop-filter:blur(8px)}
.raceDockInner{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:7px;overflow-x:auto;white-space:nowrap}
.raceDock button{flex:none;padding:8px 11px;font-size:13px;border-radius:8px}
.raceDock .dockLabel{font-size:11px;color:var(--mu);font-weight:700;margin:0 2px}
.raceScrollPad{height:92px}
.mandateBar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.mandateBar>div{background:var(--pn2);border-radius:8px;padding:8px}
@media(max-width:520px){.profileHero{grid-template-columns:84px 1fr}.profileOvr{width:78px;height:78px;font-size:30px}.skillRow{grid-template-columns:95px 1fr 28px}.marketGrid{grid-template-columns:1fr}.raceDockInner{gap:5px}.raceDock button{padding:7px 9px;font-size:12px}.raceScrollPad{height:102px}}


body{background:radial-gradient(900px 420px at 85% -8%,color-mix(in srgb,var(--ac) 16%,transparent),transparent),radial-gradient(700px 400px at -10% 110%,color-mix(in srgb,var(--tx) 7%,transparent),transparent),var(--bg)}
main{max-width:1100px}
.card{border-radius:14px;box-shadow:0 10px 26px -18px rgba(0,0,0,.55);position:relative;overflow:hidden;padding-left:18px}

.hd{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:12px 16px;box-shadow:0 10px 26px -18px rgba(0,0,0,.55)}
.tabs{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);padding:8px 2px}
.tabs .on,.seg .on{background:var(--ac);border-color:var(--ac);color:#fff}
.btn{background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 85%,#fff),var(--ac));box-shadow:0 8px 18px -10px var(--ac);transition:transform .12s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.tb{border-radius:12px;overflow:hidden}.tb th{font:600 11px system-ui;letter-spacing:.06em;color:var(--mu);background:var(--pn2)}
.tb tr:hover td{background:color-mix(in srgb,var(--pn2) 70%,transparent)}.tb td:first-child{font:700 14px "Chakra Petch",sans-serif;width:34px}
.hero{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:28px;align-items:center;min-height:84vh}
.hero .home{min-height:0;margin:0;width:100%}
.trkBox{background:var(--pn);border:1px solid var(--ln);border-radius:22px;padding:18px;display:grid;gap:14px;box-shadow:0 24px 50px -30px rgba(0,0,0,.6)}
.trk{width:100%;height:auto;display:block}.trkBig .trk{max-height:320px}
.trkGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.trkGrid button:hover{outline:2px solid var(--ac)}.trkGrid small{font-size:11px}
.trkSide{float:right;width:min(46%,210px);margin:0 0 6px 12px}
.av{display:inline-grid;place-items:center;border-radius:50%;background:var(--k,#666);color:#fff;font:700 10px "Chakra Petch",sans-serif;overflow:hidden;vertical-align:middle;margin-right:7px;border:2px solid var(--k,#666);flex:none}
img.av{object-fit:cover;background:var(--pn2)}
.phg{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:6px;margin-top:10px}.phr{display:flex;align-items:center;gap:6px}.phr span{flex:1}
.sm{padding:5px 10px;font-size:12px;cursor:pointer;border-radius:8px}
@media(max-width:780px){.hero{grid-template-columns:1fr;min-height:0}}
.carRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.carSlot{border:1px solid var(--ln);border-radius:10px;padding:8px;background:var(--pn2)}.carSlot.on{border-color:var(--ok)}
.calendarOrder{display:grid;gap:7px;margin-top:10px}.calendarOrderItem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px;background:var(--pn2);border:1px solid var(--ln);border-radius:9px}.calendarOrderName{display:grid;gap:2px;min-width:0}.calendarOrderName small{font-size:11px;color:var(--mu)}.calendarOrderActions{display:flex;gap:5px}.calendarOrderActions button{min-width:54px}@media(max-width:430px){.calendarOrderItem{grid-template-columns:1fr}.calendarOrderActions button{flex:1}}

/* Driver selection, compact radio controls and sponsor contracts */
.driverPicker{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 8px}
.driverSelect{display:flex;align-items:center;gap:8px;text-align:left;background:var(--pn2);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:9px 12px;cursor:pointer;min-width:0;flex:1}

/* Championship clinch + live car comparison */
.championGold{color:#d4a017!important;font-weight:850;text-shadow:0 0 9px rgba(212,160,23,.22);white-space:nowrap}
.championGold .championMark{font-size:11px;letter-spacing:.04em;border:1px solid currentColor;border-radius:5px;padding:1px 5px;margin-left:5px;vertical-align:1px}
.titleLockCard{border-left:5px solid #d4a017;background:linear-gradient(110deg,color-mix(in srgb,#d4a017 8%,var(--pn)),var(--pn))}
.titleLockGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:9px}
.titleLockGrid>div{background:var(--pn2);border-radius:9px;padding:9px;min-width:0}
.titleLockGrid b{display:block;margin-bottom:3px}
.liveCompare{border-left:5px solid #d4a017}
.liveCompareSelectors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.liveCompareSelectors label{display:block;min-width:0;font-size:12px;color:var(--mu)}
.liveCompareSelectors select{width:100%;margin-top:4px;padding:8px;border:1px solid var(--ln);border-radius:8px;background:var(--pn2);color:var(--tx);font:inherit}
.liveCompareTable{width:100%;border-collapse:collapse;background:var(--pn);font-size:12px}
.liveCompareTable th,.liveCompareTable td{padding:8px 7px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:middle}
.liveCompareTable th{background:var(--pn2);color:var(--mu);font-weight:700}
.liveCompareTable td:not(:first-child),.liveCompareTable th:not(:first-child){text-align:center}
.liveCompareTable .meCol{background:color-mix(in srgb,var(--ac) 7%,transparent)}
.liveCompareVerdict{margin-top:9px;padding:9px 11px;border-radius:8px;background:var(--pn2);font-size:13px}
@media(max-width:600px){.titleLockGrid{grid-template-columns:1fr}.liveCompareSelectors{grid-template-columns:1fr}.liveCompareTable{font-size:11px}.liveCompareTable th,.liveCompareTable td{padding:7px 5px}}


.financeCard,.aiDevelopmentCard,.puManager,.teamMoveCard,.penaltyReport{border-left:5px solid var(--ac)}
.financeBreakdown{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.financeBreakdown span{background:var(--pn2);border-radius:6px;padding:5px 8px;font-size:12px}
.careerTeamSelect,.puUnitRow select{width:100%;padding:8px;border:1px solid var(--ln);border-radius:8px;background:var(--pn2);color:var(--tx);font:inherit;margin-top:5px}
.puCar{border-top:1px solid var(--ln);padding-top:10px;margin-top:12px}.puRuleNote{background:var(--pn2);border-radius:8px;padding:9px;margin:8px 0;font-size:12px;color:var(--mu)}
.puUnitRow{display:grid;grid-template-columns:minmax(120px,1fr) minmax(110px,.7fr) auto;gap:7px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}.puUnitInfo{min-width:0}.puUnitInfo small{display:block;font-size:11px;color:var(--mu)}.puLiveStatus{border-left:5px solid var(--ok)}
.penaltyItem{padding:8px 0;border-top:1px solid var(--ln)}.penaltyItem small{color:var(--mu)}

mall>Terdaftar sebagai pembalap Formula 2 2026. Rating, nilai transfer, dan kontrak akademi di game adalah estimasi gameplay.</small><div class="row"><button class="btn2" onclick="go('market')">Lihat di Market</button></div></div>`:`<div class="card"><b>Catatan karier</b><br><small>Pensiun setelah musim ${d.retiredYear||'-'}.</small></div>`}`}

function hireFromMarket(kind,id){const seat=marketTargetSeat,slot=S.d.findIndex(d=>d.t===S.me&&d.seat===seat);if(slot<0)return toast('Kursi mobil tidak ditemukan');const incumbent=S.d[slot];if(kind==='F1'){const idx=+id,target=S.d[idx];if(!target||target.t===S.me)return toast('Pembalap tidak tersedia');const cost=marketFee(target);if(S.m<cost)return toast('Dana tidak cukup');const oldTeam=target.t,oldSeat=target.seat;S.m-=cost;target.t=S.me;target.seat=seat;incumbent.t=oldTeam;incumbent.seat=oldSeat;target.c=Math.max(target.c||1,target.contractEnd?target.contractEnd-S.y:1);incumbent.c=2;toast(target.n+' bergabung. '+incumbent.n+' pindah ke '+TM[oldTeam].n)}else{const candidate=S.academyPool.find(d=>d.id===id);if(!candidate)return toast('Kandidat akademi tidak tersedia');const cost=marketFee(candidate);if(S.m<cost)return toast('Dana tidak cukup');S.m-=cost;S.formerDrivers.push({...incumbent,formerTeam:S.me,formerYear:S.y,retireId:'former-'+Date.now()});S.d[slot]={...candidate,t:S.me,seat,p:0,w:0,c:3,h:75,series:'F1',contractEnd:S.y+3,academyOrigin:true,skills:{...candidate.skills},s:candidate.s};S.academyPool=S.academyPool.filter(d=>d.id!==id);toast(candidate.n+' dipromosikan ke F1')}auto();render()}
function rec(i){const d=S.d[i],f=fee(d),m=mine(),o=S.d[(m[dsl]||m[0]).i];if(S.m<f)return;const oldTeam=d.t,oldSeat=d.seat;S.m-=f;d.t=S.me;d.seat=o.seat;o.t=oldTeam;o.seat=oldSeat;d.c=2;d.h=70;auto();render()}
function playerDecline(d){const age=d.age||26;if(age<32)return 0;if(age<35)return .25;if(age<38)return .65;if(age<41)return 1.15;if(age<44)return 1.8;return 2.4}
function retirementChance(age){return age<38?0:age<40?.10:age<42?.23:age<44?.43:.68}
function academyToF1(candidate,team,seat){return{...candidate,t:team,seat,p:0,w:0,c:3,h:75,series:'F1',contractEnd:S.y+3,academyOrigin:true,skills:{...candidate.skills},s:candidate.s}}
function ageDriversAndRetire(){S.d.forEach((d,i)=>{d.age=(d.age||25)+1;const loss=playerDecline(d);if(loss>0){d.s=clamp(d.s-loss,55,99);const sk=skillSet(d);sk.pace=clamp(sk.pace-loss*.9,45,99);sk.cornering=clamp(sk.cornering-loss*.55,45,99);sk.awareness=clamp(sk.awareness-loss*.25,45,99);sk.racecraft=clamp(sk.racecraft-loss*.12,45,99);d.skills=sk}else if(d.age<=25){d.s=clamp(d.s+.25,55,99);const sk=skillSet(d);sk.pace=clamp(sk.pace+.3,45,99);sk.experience=clamp(sk.experience+.8,45,99);d.skills=sk}if(d.age>=38&&Math.random()<retirementChance(d.age)){const old={...d,skills:{...skillSet(d)},retiredYear:S.y+1,retireId:'ret-'+S.y+'-'+i};S.retiredDrivers.push(old);const rookie=S.academyPool.slice().sort((a,b)=>b.s-a.s)[0];if(rookie){S.d[i]=academyToF1(rookie,d.t,d.seat);S.academyPool=S.academyPool.filter(x=>x.id!==rookie.id);S.retirementLog.unshift(`${d.n} pensiun pada usia ${d.age}. ${rookie.n} dipromosikan dari F2 ke ${TM[d.t].n}.`)}else{d.retired=true;S.retirementLog.unshift(`${d.n} pensiun pada usia ${d.age}.`);S.d[i]={...d,n:'Rookie Academy '+(S.y+1),age:20,s:72,t:d.t,seat:d.seat,p:0,w:0,c:3,h:75,series:'F1',contractEnd:S.y+3,skills:makeSkills(72,20,i)}}}});S.retirementLog=S.retirementLog.slice(0,12)}
function nextSeason(){const r=ts().findIndex(x=>x.i==S.me);S.h.push({y:S.y,dc:ds()[0]?.n||'-',tc:TM[ts()[0]?.i||0].n,r:r+1});S.m+=150-r*11+spB().t;S.y++;S.sp=null;S.pd=0;S.rd=0;S.last=null;ageDriversAndRetire();S.t.forEach((T,t)=>{T.p=0;if(t!==S.me)T.c=T.c.map(v=>Math.min(99,Math.max(60,v+R()*1.2)))});S.d.forEach(d=>{d.p=d.w=0;if(d.t===S.me){d.c=(d.c==null?2:d.c)-1;if((d.h||70)<25)d.c=0}});S.tl=null;const n=[0,2,3,4][ST.tr];if(n&&(S.y-2026)%n===0){S.tl=[];for(let z=0;z<5;z++){const a=S.d[Math.random()*22|0],b=S.d[Math.random()*22|0];if(a.t===b.t||a.t===S.me||b.t===S.me)continue;S.tl.push(`${a.n}: ${TM[a.t].n} ke ${TM[b.t].n}`,`${b.n}: ${TM[b.t].n} ke ${TM[a.t].n}`);[a.t,b.t]=[b.t,a.t];[a.seat,b.seat]=[b.seat,a.seat]}}S.fp1Mandate={0:0,1:0};S.fp1Log=[];S.raceHistory=S.raceHistory||[];CAL_ORDER=[...S.cal];CS=new Set(CAL_ORDER);tab='b';dsl=0;auto();go('drv')}
function currentMandateTotal(){return (S.fp1Mandate?.[0]||0)+(S.fp1Mandate?.[1]||0)}

function fp1SubstituteRows(ci,rows,seat,candidate){const driver=S.d.find(d=>d.t===S.me&&d.seat===seat);if(!driver||!candidate)return rows;const row=rows.find(r=>r.i===S.d.indexOf(driver));if(!row)return rows;row.time=clamp(row.time+(driver.s-candidate.s)*.045,50,150);row.driverName=candidate.n;row.driverOvr=candidate.s;row.substitute=true;row.driverCategory='F2 Academy';row.seat=seat;row.academyId=candidate.id;return rows}

 else if(w.st<3){const sd=Math.max(3,[12,7][w.st-1]-S.f[3]*1.5-S.f[12]*.8),d=ideal(ci);w.fb=feedback(w,ci,sd);const rows=practiceRows(ci,w.st+1);w.tb=rows.map(r=>({i:r.i,name:S.d[r.i].n,time:r.time,gap:r.time-rows[0].time,status:''}));w.ses='FP'+(w.st+1);saveSessionResult(w.ses,rows)}else if(w.st<=5){runQualRound(w,ci,w.st-2);w.fb=null}else{startRace();return}w.st++;auto();render()}
function ensureWeekendData(ci){if(!S.wk){const base=SU.map(p=>p.def);S.wk={st:0,su:base.slice(),suByCar:[base.slice(),base.slice()],setupSeat:0,fb:null,tb:null,grid:null,qual:{},ses:'',fc:[0,5,10,20,30,45,60,80][Math.random()*8|0]};} const w=S.wk,rec=raceRecord(ci,S.rd+1);w.qual=w.qual||{};if(!rec.sessions.FP1){const rows=practiceRows(ci,1);if(currentMandateTotal()<4){let seat=mandateSeatDefault();if((S.fp1Mandate[seat]||0)>=2)seat=seat===0?1:0;const candidate=S.academyPool.slice().sort((a,b)=>b.s-a.s)[0];if(candidate){fp1SubstituteRows(ci,rows,seat,candidate);S.fp1Mandate[seat]=(S.fp1Mandate[seat]||0)+1;S.fp1Log.push({year:S.y,race:S.rd+1,ci,seat,name:candidate.n,id:candidate.id,auto:true})}}saveSessionResult('FP1',rows)}for(let n=2;n<=3;n++){const key='FP'+n;if(!rec.sessions[key])saveSessionResult(key,practiceRows(ci,n))}for(let n=1;n<=3;n++){const key='Q'+n;if(!w.qual[key]){const saved=rec.sessions[key];if(saved)w.qual[key]=saved.map(r=>({i:r.i,time:r.time,status:r.status}));else runQualRound(w,ci,n)}}if(!w.grid||w.grid.length!==S.d.length)buildQualGrid(w);w.st=6}

   strategic pit advice and expanded sponsor goal tracking.

const PIT_LOSS_KNOWN={
  6:19.7,   // Miami
  7:28.1,   // Imola, multi-season observed median
  9:22.0,   // Monaco
  10:23.8,  // Barcelona
  12:21.5,  // Austria
  13:20.9,  // Great Britain
  14:18.4,  // Spa, multi-season observed median
  23:27.9,  // Singapore, multi-season observed median
  28:27.7   // Qatar, multi-season observed median
};
function pitGreenLoss(ci){return PIT_LOSS_KNOWN[ci]??22.1}
function pitBoxSeconds(c){const level=c&&c.t===S.me?(S.f[4]||0):0;return clamp(2.45-level*.07,2.08,2.55)}
function pitLossBreakdown(r,c,flag){
 const box=pitBoxSeconds(c),green=pitGreenLoss(r.ci),lane=Math.max(0,green-2.45);
 const caution=flag==='SC'?.67:flag==='VSC'?.84:1;
 const total=box+lane*caution;
 return{box,green,sc:box+lane*.60,vsc:box+lane*.80,total,flag:flag||'GREEN'};
}
function pitLossLabel(r,c){const p=pitLossBreakdown(r,c,'GREEN');return{green:p.green,sc:p.sc,vsc:p.vsc,box:p.box}}
function selectRaceDriver(i){if(!RS||!RS.cars.some(c=>c.i===i&&c.t===S.me))return;RS.selectedDriver=i;render()}
function currentRaceDriver(){if(!RS)return null;return RS.cars.find(c=>c.i===RS.selectedDriver&&c.t===S.me&&!c.x)||RS.cars.find(c=>c.t===S.me&&!c.x)||null}

function driverRadioMessage(c,r,win){
 const remain=tyreRemaining(c),temp=Math.round(c.engineTemp||88),ers=Math.round(c.ers||0);
 if(c.q)return `Copy. ${c.n}, pit sudah dipanggil. Masuk akhir lap ini untuk ban ${c.q}.`;
 if(temp>=108)return `Temperatur power unit ${temp}°C. Kurangi beban mesin, gunakan Balanced atau Recharge untuk mendinginkan sistem.`;
 if(ers<=8&&c.engineMode==='full')return `ERS tinggal ${ers}%. Full Power tidak lagi memberi deployment tambahan. Beralih ke Balanced atau Recharge.`;
 if(r.wt===2&&c.ty!=='W')return `Grip sangat rendah dengan ban ${c.ty}. Box sekarang untuk Wet.`;
 if(r.wt===1&&'SMH'.includes(c.ty))return `Lintasan basah dan ban kering kehilangan grip. Box untuk Intermediate, kecuali radar menunjukkan hujan deras segera datang.`;
 if((r.sc==='SC'||r.sc==='VSC')&&remain<82&&r.laps-r.lap>5)return `Safety Car aktif. Pit loss lebih rendah dari kondisi hijau. Ini jendela bagus untuk mengganti ban sebelum restart.`;
 if(remain<=22&&r.lap<r.laps-1)return `Ban sudah kritis, sisa ${remain}%. Masuk pit pada kesempatan terdekat.`;
 if(r.rn&&r.wt===0&&r.rn.s-r.lap<=2)return `Radar mendeteksi hujan sekitar lap ${r.rn.s}. Tetap di lintasan jika ban masih aman; siapkan ${r.rn.i===2?'Wet':'Intermediate'}.`;
 if(c.paceMode==='push'&&remain<38)return `Degradasi meningkat karena Push. Pertimbangkan Standard untuk memperpanjang stint.`;
 if(win.soon)return `Strategi menyarankan pit di sekitar lap ${win.target}. Siapkan ${recommendedTyre(c,r)}.`;
 return `Pace stabil. Jaga temperatur, pantau gap, dan target pit window ${win.text}.`;
}
pitWindowInfo=function(c,r){
 const remain=tyreRemaining(c),rate=Math.max(.65,tyreWearRate(c,r)),lapsLeft=r.laps-r.lap;
 const wetMismatch=(r.wt===2&&c.ty!=='W')||(r.wt===1&&'SMH'.includes(c.ty))||(r.wt===0&&'IW'.includes(c.ty));
 const dryRule=!r.everWet&&c.u.length<2&&lapsLeft>4;
 const threshold=22,lapsToLimit=Math.max(0,Math.floor((remain-threshold)/rate));
 let target=r.lap+Math.max(1,lapsToLimit);
 if(dryRule)target=Math.min(target,Math.max(r.lap+1,r.laps-4));
 if(c.q)return{text:`Pit dipanggil untuk ban ${c.q}`,soon:true,target:r.lap+1};
 if(wetMismatch)return{text:'Pit sekarang · compound tidak cocok',soon:true,target:r.lap+1};
 if(remain<=threshold&&lapsLeft>1)return{text:'Pit sekarang · ban mendekati batas',soon:true,target:r.lap+1};
 if(dryRule&&target>=r.laps-3)return{text:`Lap ${Math.max(r.lap+1,r.laps-5)}–${r.laps-3} · wajib compound kedua`,soon:target<=r.lap+2,target};
 if(target>=r.laps-1||remain-rate*lapsLeft>threshold)return{text:'Bisa sampai finis dengan ban ini',soon:false,target:r.laps};
 const from=Math.max(r.lap+1,target-1),to=Math.min(r.laps-1,target+1);
 return{text:`Lap ${from}–${to}`,soon:target<=r.lap+2,target};
};
strategyAdvice=function(c,r,window){
 const remain=tyreRemaining(c),next=recommendedTyre(c,r),left=r.laps-r.lap,loss=pitLossBreakdown(r,c,r.sc||'GREEN');
 if(c.q)return `Order pit sudah dikirim untuk ban ${c.q}. Estimasi total loss ${loss.total.toFixed(1)} detik pada kondisi saat ini.`;
 if(r.sc==='SC'||r.sc==='VSC'){
  if(remain<82&&left>5||window.soon||((!r.everWet&&c.u.length<2)&&left>5))return `${r.sc==='SC'?'Safety Car':'VSC'} aktif. Ini peluang pit yang baik: estimasi loss ${loss.total.toFixed(1)} detik, dibanding ${loss.green.toFixed(1)} detik saat green flag. Rekomendasi: box untuk ${next}.`;
  return `${r.sc==='SC'?'Safety Car':'VSC'} aktif, tetapi ban masih cukup untuk strategi saat ini. Jangan pit hanya karena neutralisasi; pantau restart dan kondisi ban.`;
 }
 if(r.rn&&r.wt===0&&r.rn.s-r.lap<=3&&r.rn.s>r.lap&&remain>20)return `Radar memperkirakan hujan mulai lap ${r.rn.s}. Hindari pit kering sekarang bila ban masih aman. Siapkan ${r.rn.i===2?'Wet':'Intermediate'} dan pantau perubahan intensitas.`;
 if((r.wt===2&&c.ty!=='W')||(r.wt===1&&'SMH'.includes(c.ty)))return `Compound sekarang tidak cocok dengan grip lintasan. Rekomendasi: pit sekarang untuk ${next}.`;
 if(r.wt===0&&'IW'.includes(c.ty))return `Lintasan mulai kering. Rekomendasi ganti ke ${next}; ban hujan akan kehilangan waktu saat dry line terbentuk.`;
 if(remain<=22&&left>1)return `Sisa ban ${remain}%. Degradasi sudah kritis. Box pada kesempatan terdekat untuk ${next}.`;
 if(!r.everWet&&c.u.length<2&&left<=5)return `Kewajiban dua compound kering belum terpenuhi. Pit sebelum finis untuk memakai compound kering kedua.`;
 if(window.text.startsWith('Bisa sampai finis'))return `Tidak perlu pit lagi berdasarkan estimasi degradasi. Jaga ban dan hindari Push berlebihan.`;
 return `Pit window yang disarankan: ${window.text}. Target compound ${next}. Estimasi loss green flag di sirkuit ini ${loss.green.toFixed(1)} detik. Strategi menimbang degradasi, sisa lap, dan traffic.`;
};

const _finishRaceWithSponsorMetrics=finR;
finR=function(){
 const r=RS;
 if(r&&!r.sponsorCredited){
  S.sponsorStats=S.sponsorStats||{wins:0,top5:0,double:0,fast:0,races:0};
  const finishTime=c=>c.tot+(!r.everWet&&(!c.u||c.u.length<2)?20:0);
  const classified=r.cars.filter(c=>!c.x).sort((a,b)=>finishTime(a)-finishTime(b));
  const playerCars=r.cars.filter(c=>c.t===S.me);
  const winner=classified[0];
  S.sponsorStats.races++;
  if(winner&&winner.t===S.me)S.sponsorStats.wins++;
  S.sponsorStats.top5+=classified.slice(0,5).filter(c=>c.t===S.me).length;
  if(playerCars.length===2&&playerCars.every(c=>!c.x))S.sponsorStats.double++;
  const fastest=r.cars.filter(c=>Number.isFinite(c.bestLap)).sort((a,b)=>a.bestLap-b.bestLap)[0];
  if(fastest&&fastest.t===S.me)S.sponsorStats.fast++;
  r.sponsorCredited=true;
 }
 return _finishRaceWithSponsorMetrics();
};

/* Annual regulation reset: carry the car forward, but trim ratings instead of recreating the 2026 baseline. */
const _nextSeasonWithSeasonalDevelopment = nextSeason;
nextSeason=function(){
 const before=S&&S.t&&S.t[S.me]?S.t[S.me].c.slice():[];
 _nextSeasonWithSeasonalDevelopment();
 if(!S||!Array.isArray(S.t))return;
 if(S.lastRegulationResetYear!==S.y){
  let playerLoss=0;
  S.t.forEach((team,index)=>{
   team.c=(team.c||[]).map((value,j)=>{
    const old=Number(value)||60;
    const reduction=3.0;
    const next=Math.max(55,Math.round((old-reduction)*10)/10);
    if(index===S.me)playerLoss+=old-next;
    return next;
   });
  });
  S.lastRegulationResetYear=S.y;
  S.regulationInfo={year:S.y,averagePlayerDrop:+(playerLoss/Math.max(1,S.t[S.me].c.length)).toFixed(1),before,after:S.t[S.me].c.slice(),message:'Regulasi teknis baru mengurangi rating dasar mobil semua tim. Progres sebelumnya tetap terbawa; fasilitas, upgrade, dan komponen R&D yang sudah dipasang tidak dihapus.'};
 }
 auto();
 render();
 toast(`Regulasi teknis ${S.y}: rating dasar mobil disesuaikan. Mobil tetap bisa di-upgrade.`);
};

/* Live race analysis: tyre feedback and strategic scenario planning are kept separate. */
function intelOrderedCars(r){return (r.cars||[]).filter(c=>!c.x).slice().sort((a,b)=>a.tot-b.tot)}
function intelNearestRival(c,r,dir){
 const order=intelOrderedCars(r),ix=order.findIndex(x=>x.i===c.i),step=dir==='ahead'?-1:1;
 for(let j=ix+step;j>=0&&j<order.length;j+=step)if(order[j].t!==S.me)return order[j];

}
function intelGap(a,b){return a&&b?Math.abs(a.tot-b.tot):Infinity}
function intelTyreReadout(c,r){
 const remain=tyreRemaining(c),rate=Math.max(.1,tyreWearRate(c,r)),grip=driverGripScore(c,r),next=recommendedTyre(c,r);
 const lapsToLimit=Math.max(0,Math.floor(Math.max(0,remain-22)/rate));
 const projected=clamp(remain-rate*Math.min(3,Math.max(0,r.laps-r.lap)),0,100);
 const base=TYO[c.ty]||0,warm=c.age===0?.55:c.age===1?.16:0;
 const degradation=Math.max(0,tyPace(c,r)-base-warm);
 const mismatch=(r.wt===2&&c.ty!=='W')||(r.wt===1&&'SMH'.includes(c.ty))||(r.wt===0&&'IW'.includes(c.ty));
 let advice='Kondisi ban masih dalam rentang kerja. Pantau degradasi dan pertahankan mode mengemudi sesuai target stint.';
 let urgency='normal';
 if(mismatch){urgency='critical';advice=r.wt===2?`Grip sangat rendah dengan ${c.ty}. Segera pertimbangkan ban Wet.`:r.wt===1?`Lintasan basah, ban ${c.ty} kehilangan grip. Pertimbangkan Intermediate atau Wet sesuai intensitas hujan.`:`Lintasan mengering. Ban ${c.ty} mulai tidak cocok; pertimbangkan kembali ke compound kering.`}
 else if(r.rn&&r.wt===0&&r.rn.s-r.lap<=3&&r.rn.s>r.lap){urgency='watch';advice=`Radar memperkirakan hujan sekitar lap ${r.rn.s}. Tunda pit kering jika ban masih aman, siapkan ${r.rn.i===2?'Wet':'Intermediate'}.`}
 else if(remain<=22&&r.lap<r.laps-1){urgency='critical';advice=`Sisa ban ${remain}% dan degradasi ${rate.toFixed(1)}% per lap. Rekomendasi: pit pada kesempatan terdekat, target ${next}.`}
 else if(projected<=25&&r.laps-r.lap>3){urgency='watch';advice=`Dalam tiga lap, sisa ban diperkirakan turun ke ${Math.round(projected)}%. Mulai siapkan pit window ${pitWindowInfo(c,r).text}, target ${next}.`}
 else if((c.paceMode||'standard')==='push'&&rate>1.65){urgency='watch';advice=`Mode Push menaikkan degradasi menjadi ${rate.toFixed(1)}% per lap. Beralih ke Standard atau Conserve dapat memperpanjang stint.`}
 else if(grip<65){urgency='watch';advice=`Grip ban hanya ${grip}/100. Hindari duel agresif dan prioritaskan compound yang cocok dengan kondisi trek.`}
 else advice=`Ban ${c.ty} masih cukup konsisten. Estimasi ${lapsToLimit} lap sebelum mendekati batas strategi; pit window ${pitWindowInfo(c,r).text}.`;
 return {remain,rate,grip,next,lapsToLimit,projected,degradation,mismatch,urgency,advice};
}
function tyreStrategyIntel(c,r){

function strategyEngineerReadout(c,r){
 const win=pitWindowInfo(c,r),loss=pitLossBreakdown(r,c,r.sc||'GREEN'),ahead=intelNearestRival(c,r,'ahead'),behind=intelNearestRival(c,r,'behind');
 const remain=tyreRemaining(c),next=recommendedTyre(c,r),left=r.laps-r.lap;
 const gapAhead=intelGap(c,ahead),gapBehind=intelGap(c,behind);
 const freshPenalty=(TYO[next]||0)+.55;
 const aheadPenalty=ahead?tyPace(ahead,r):0;
 const undercutGain=ahead?Math.max(0,aheadPenalty-freshPenalty):0;
 const undercutWindow=Math.min(2,Math.max(1,left));
 const undercutTotal=undercutGain*undercutWindow;
 const undercutReady=!!(ahead&&r.wt===0&&!r.sc&&!ahead.q&&ahead.age>=4&&remain<=78&&gapAhead<=4.5&&undercutTotal>=Math.max(.35,gapAhead*.35));
 const recentlyPitted=[ahead,behind].filter(x=>x&&x.pit>(c.pit||0)&&x.age<=2).sort((a,b)=>intelGap(c,a)-intelGap(c,b))[0]||null;
 const overcutGain=recentlyPitted?Math.max(0,tyPace(recentlyPitted,r)-tyPace(c,r)):0;
 const overcutReady=!!(recentlyPitted&&r.wt===0&&!r.sc&&remain>35&&overcutGain>=.18&&left>3);
 const coverThreat=!!(behind&&behind.pit>(c.pit||0)&&behind.age<=2&&gapBehind<=4.5&&remain<=72);
 const neutral=r.sc==='SC'||r.sc==='VSC';
 const neutralSaving=Math.max(0,loss.green-loss.total);
 const neutralReady=!!(neutral&&left>4&&(remain<84||win.soon||intelTyreReadout(c,r).mismatch));
 const trafficRisk=!!(behind&&gapBehind<loss.green);
 let headline='Pertahankan stint';let detail=`Belum ada keuntungan jelas dari pit lebih awal. Jaga pace dan evaluasi kembali pada pit window ${win.text}.`;
 let type='normal';
 if(neutralReady){headline=`Manfaatkan ${r.sc}`;detail=`Estimasi pit loss saat ini ${loss.total.toFixed(1)} detik, sekitar ${neutralSaving.toFixed(1)} detik lebih hemat dibanding Green Flag. Pertimbangkan pit untuk ${next}, selama tidak kembali ke traffic berat.`;type='good'}
 else if(coverThreat){headline='Pertimbangkan cover undercut';detail=`${behind.n} sudah memakai ban lebih baru dan berada ${gapBehind.toFixed(1)} detik di belakang. Bila ban kamu mulai turun, pit pada lap berikutnya dapat mencegah mereka mengambil keuntungan undercut.`;type='watch'}
 else if(undercutReady){headline=`Peluang undercut · target ${ahead.n}`;detail=`${ahead.n} berada ${gapAhead.toFixed(1)} detik di depan dengan ban berumur ${ahead.age} lap. Selisih pace ban memberi potensi sekitar ${undercutTotal.toFixed(2)} detik dalam ${undercutWindow} lap setelah pit, sebelum faktor traffic dan out-lap. Undercut layak dipertimbangkan.`;type='good'}
 else if(overcutReady){headline=`Peluang overcut · target ${recentlyPitted.n}`;detail=`${recentlyPitted.n} baru pit. Ban kamu masih memberi estimasi keunggulan ${overcutGain.toFixed(2)} detik per lap terhadap fase out-lap mereka. Tetap di trek 1 lap dapat memberi peluang overcut, asalkan sisa ban tetap aman.`;type='good'}
 else if(win.soon||remain<=28){headline='Pit window sudah dekat';detail=`Pit window ${win.text}. Target ${next}. Pit loss saat ini ${loss.total.toFixed(1)} detik. Periksa traffic sebelum memanggil pit.`;type='watch'}
 else if(trafficRisk){headline='Waspadai traffic saat pit-out';detail=`${behind.n} hanya ${gapBehind.toFixed(1)} detik di belakang. Pit sekarang kemungkinan membuat mobil kembali ke lintasan di belakang traffic. Pertimbangkan menunggu celah bersih, kecuali ban sudah kritis.`;type='watch'}
 else if(r.rn&&r.wt===0&&r.rn.s-r.lap<=3&&r.rn.s>r.lap){headline='Tahan pit untuk perubahan cuaca';detail=`Hujan diperkirakan mulai lap ${r.rn.s}. Hindari pit kering jika ban aman; siapkan ${r.rn.i===2?'Wet':'Intermediate'} dan evaluasi ulang saat hujan tiba.`;type='watch'}
 const scenarios=[
  `<b>Undercut:</b> ${undercutReady?`layak dipertimbangkan melawan ${ahead.n} (potensi pace ${undercutTotal.toFixed(2)} dtk dalam ${undercutWindow} lap).`:'belum ada jendela kuat; butuh rival di depan dengan ban lebih tua dan gap yang masih bisa dijangkau.'}`,
  `<b>Overcut:</b> ${overcutReady?`tersedia melawan ${recentlyPitted.n}; pertimbangkan satu lap tambahan bila ban tetap aman.`:'belum ada rival yang baru pit dengan kondisi yang menguntungkan untuk overcut.'}`,
  `<b>Cover:</b> ${coverThreat?`waspadai ${behind.n} yang sudah pit; pertimbangkan masuk pit sebelum kehilangan posisi.`:'tidak ada ancaman undercut langsung yang terdeteksi.'}`,
  `<b>Neutralisasi:</b> ${neutral?`${r.sc} aktif; estimasi penghematan pit sekitar ${neutralSaving.toFixed(1)} dtk dibanding Green Flag.`:'belum aktif. Estimasi pit loss Green ${loss.green.toFixed(1)} dtk, VSC ${loss.vsc.toFixed(1)} dtk, SC ${loss.sc.toFixed(1)} dtk.'}`
 ];
 const position=intelOrderedCars(r).findIndex(x=>x.i===c.i)+1;
 return `<div class="intelDriver"><div class="intelDriverTitle"><div>${av(S.d[c.i].n,TM[c.t].k,28)} <b>${S.d[c.i].n}</b> <small>· P${position||'-'}</small></div><span class="intelStatus ${type}">${type==='good'?'Peluang':type==='watch'?'Perhatian':'Evaluasi'}</span></div><div class="intelRecommendation"><b>${headline}</b><div>${detail}</div></div><div class="intelStats"><span>Gap ke depan: <b>${ahead?gapAhead.toFixed(1)+'s':'—'}</b></span><span>Gap belakang: <b>${behind?gapBehind.toFixed(1)+'s':'—'}</b></span><span>Pit window: <b>${win.text}</b></span><span>Pit loss saat ini: <b>${loss.total.toFixed(1)}s</b></span></div><div class="intelScenario">${scenarios.map(s=>`<div>${s}</div>`).join('')}</div></div>`;
}

/* ================================================================
   Championship titles are shown only when mathematically secured.
   Driver maximum: 25 points per remaining race.
   Constructor maximum: 43 points per remaining race (P1 + P2).
   ================================================================ */
function championshipRemainingRaces(){return Math.max(0,(Array.isArray(S.cal)?S.cal.length:0)-(Number(S.rd)||0))}
function championshipTeamWins(team){return S.d.filter(d=>d.t===team).reduce((n,d)=>n+(Number(d.w)||0),0)}
function championshipTeamOrder(){return ts().sort((a,b)=>b.p-a.p||championshipTeamWins(b.i)-championshipTeamWins(a.i)||a.i-b.i)}
function championshipHolder(kind){
 if(!S||!Array.isArray(S.d)||!Array.isArray(S.t))return null;
 const remaining=championshipRemainingRaces();
 if(kind==='wdc'){
  const order=ds();if(!order.length)return null;
  const lead=order[0],leadWins=Number(lead.w)||0;
  for(const other of order.slice(1)){
   const p=Number(other.p)||0,lp=Number(lead.p)||0;
   if(remaining>0){if(lp<=p+25*remaining)return null}
   else if(lp<p||(lp===p&&leadWins<=(Number(other.w)||0)))return null;
  }
  return lead.i;
 }
 const order=ts();if(!order.length)return null;
 const lead=order[0],leadWins=S.d.filter(d=>d.t===lead.i).reduce((n,d)=>n+(Number(d.w)||0),0);
 for(const other of order.slice(1)){
  const p=Number(other.p)||0,lp=Number(lead.p)||0;
  const otherWins=championshipTeamWins(other.i);
  if(remaining>0){if(lp<=p+43*remaining)return null}
  else if(lp<p||(lp===p&&leadWins<=otherWins))return null;
 }
 return lead.i;
}

 if(delta!=null){verdict=Math.abs(delta)<.05?'Pace lap terakhir keduanya hampir sama.':delta<0?`${ownDriver.n} lebih cepat ${Math.abs(delta).toFixed(3)} detik pada lap terakhir.`:`${rivalDriver.n} lebih cepat ${delta.toFixed(3)} detik pada lap terakhir.`}

 if(!S.aiDevelopment||S.aiDevelopment.year!==S.y||!S.aiDevelopment.teams)resetAIFinanceForSeason();
 S.t.forEach((T,i)=>{
  let a=S.aiDevelopment.teams[i];
  if(!a)a=S.aiDevelopment.teams[i]={spent:0,developmentSpent:0,limit,focus:(i+S.y)%4,nextFocusAt:5,investmentRate:.39,progress:0};
  a.limit=limit;a.spent=Math.max(0,+a.spent||0);a.developmentSpent=Math.max(0,+a.developmentSpent||0);

function teamWeakestArea(teamIndex,exclude=-1){const c=S.t[teamIndex].c;return c.map((v,i)=>({v,i})).filter(x=>x.i!==exclude).sort((a,b)=>a.v-b.v)[0]?.i??0}
function advanceAITeamDevelopment(){
 if(!S||!S.t)return;ensureAIDevelopment();
 const races=Math.max(17,S.cal&&S.cal.length||22),gridAverage=S.t.reduce((a,t)=>a+ovr(t.c),0)/S.t.length;
 S.t.forEach((T,t)=>{
  if(t===S.me)return;
  const a=S.aiDevelopment.teams[t];
  if(S.rd>=a.nextFocusAt||a.focus==null){a.focus=teamWeakestArea(t);a.nextFocusAt=S.rd+4}
  const second=teamWeakestArea(t,a.focus);
  const avg=ovr(T.c),catchUp=simClamp((gridAverage-avg)*.002,-.025,.035);
  a.investmentRate=simClamp(.39+catchUp,.34,.45);
  const invest=a.limit*a.investmentRate/races,operations=a.limit*.27/races;
  const allowed=Math.max(0,a.limit-a.spent),usableInvest=Math.min(invest,Math.max(0,allowed-operations));
  const factor=invest>0?simClamp(usableInvest/invest,0,1):0;
  a.spent+=Math.min(allowed,operations+usableInvest);a.developmentSpent+=usableInvest;
  if(factor<=0)return;
  const talent=simClamp(.90+(avg-75)*.004, .86,1.10)*[.88,1,1.12][ST.dif||1];
  const gains=[.08,.08,.08,.08];gains[a.focus]=.23;gains[second]=.13;
  T.c=T.c.map((v,j)=>Math.min(99,Math.round((v+gains[j]*factor*talent+(Math.random()-.5)*.018)*100)/100));
  a.progress+=gains.reduce((x,y)=>x+y,0)*factor*talent;
 });
}

 S.wk=null;S.sp=null;S.so=null;S.last=null;S.pendingTeam=null;S.regulationInfo=null;S.teamMoveLog=Array.isArray(S.teamMoveLog)?S.teamMoveLog:[];
 S.teamMoveLog.unshift({year:S.y,from:TM[oldTeam].n,to:TM[newTeam].n});
}
function resetPUForNewSeason(){if(!S)return;S.d.forEach(d=>{d.pu=makePUState()})}
function penaltyDescription(p){return p.grid?`${p.kind}: +${p.grid} posisi grid${p.detail?` · ${p.detail}`:''}`:`${p.kind}: +${p.seconds||0} detik${p.detail?` · ${p.detail}`:''}`}
function applyRaceStewards(r){
 if(!r||r.stewardsProcessed)return;r.stewardsProcessed=true;r.stewardLog=[];
 (r.cars||[]).forEach(c=>{
  c.penalties=Array.isArray(c.penalties)?c.penalties:[];if(c.x)return;
  const d=S.d[c.i],sk=skillSet(d),aw=+sk.awareness||75,laps=Math.max(1,r.lap||r.laps),paceFactor=c.paceMode==='push'?1.22:1;
  let limits=0;const pLimit=simClamp((.020+(85-aw)*.00035+(C[r.ci].a===3?.003:0))*paceFactor,.008,.04);
  for(let lapNo=0;lapNo<laps;lapNo++)if(Math.random()<pLimit)limits++;
  if(limits>=4){const n=Math.floor(limits/4),seconds=5*n;c.penalties.push({kind:'Track limits',seconds,grid:0,detail:`${limits} pelanggaran tercatat`});c.tot+=seconds;r.stewardLog.unshift(`${d.n}: penalti ${seconds} detik karena ${limits} pelanggaran track limits.`)}
  else if(limits>0){c.penalties.push({kind:'Track limits warning',seconds:0,grid:0,detail:`${limits} pelanggaran tercatat; belum mencapai ambang penalti`});if(c.t===S.me)r.stewardLog.unshift(`${d.n}: ${limits} peringatan track limits, belum ada penalti waktu.`)}
  for(let pitNo=0;pitNo<(c.pit||0);pitNo++){
   if(Math.random()<.004){c.penalties.push({kind:'Pit lane speeding',seconds:5,grid:0,detail:'Kecepatan pit lane melebihi batas'});c.tot+=5;r.stewardLog.unshift(`${d.n}: penalti 5 detik karena speeding di pit lane.`)}
   const crew=c.t===S.me?(S.f[4]||0):0,unsafeChance=Math.max(.003,.012-crew*.0015);
   if(Math.random()<unsafeChance){c.penalties.push({kind:'Unsafe release',seconds:5,grid:0,detail:'Release mobil tidak aman'});c.tot+=5;r.stewardLog.unshift(`${d.n}: penalti 5 detik karena unsafe release.`)}
  }
  const battles=Math.max(0,(c.overtakes||0)-1),collisionChance=simClamp(battles*.006+(c.driverOrder==='attack'?.003:0)+(ST.chaos===2?.004:0),0,.035);
  if(Math.random()<collisionChance){const seconds=5;c.penalties.push({kind:'Causing a collision',seconds,grid:0,detail:'Kontak yang dapat dihindari saat duel'});c.tot+=seconds;r.stewardLog.unshift(`${d.n}: penalti 5 detik karena menyebabkan kontak yang dapat dihindari.`)}
 });
 r.stewardLog=r.stewardLog.slice(0,12);r.stewardLog.forEach(x=>r.log.unshift(`Stewards: ${x}`));r.log=r.log.slice(0,18);
}
function stewardGridQualifying(w){
 if(!w||w.stewardPenaltyChecked)return;w.stewardPenaltyChecked=true;w.stewardNotes=Array.isArray(w.stewardNotes)?w.stewardNotes:[];
 // Rare, contextualised qualifying-impeding event; awareness reduces the risk.
 const q3=(w.qual&&w.qual.Q3)||[];
 q3.forEach(row=>{const d=S.d[row.i];if(!d)return;const aw=skillSet(d).awareness;const chance=simClamp(.004+(78-aw)*.00012,.001,.009);if(Math.random()<chance){d.stewardGridPenalty=(d.stewardGridPenalty||0)+3;const msg=`${d.n} menerima penalti grid 3 posisi karena impeding saat kualifikasi.`;w.stewardNotes.push(msg)}});
}

/* Finance and AI development are initialised after load/new-game normalisation. */
const _normalizeWithCareerSystems=normalizeGame;
normalizeGame=function(){_normalizeWithCareerSystems();if(S){ensureCostCap();ensureAIDevelopment();ensureAllPU();ensureCareerTeamAssets()}};
const _newGameWithCareerSystems=newGame;
newGame=function(){_newGameWithCareerSystems();if(S){ensureAllPU();ensureCostCap();resetAIFinanceForSeason();ensureCareerTeamAssets()}};
const _startWithCostCap=start;
start=function(){_startWithCostCap();ensureCostCap();ensureAIDevelopment();auto()};

/* Guard development purchases against the annual team cost cap. Driver fees and PU supply are separate. */
const _buyUWithCostCap=buyU;
buyU=function(i){ensureCostCap();const cost=ucost(i);if(!canSpendUnderCap(cost))return toast('Cost cap tidak cukup untuk upgrade ini. Sisa '+fm(costCapRemaining())+'.');const before=S.m;_buyUWithCostCap(i);const paid=Math.max(0,before-S.m);if(paid){recordCostCapSpend(paid,'Upgrade mobil');auto();render() }};
const _buyFWithCostCap=buyF;
buyF=function(i){ensureCostCap();const cost=facilityCost(i);if(!canSpendUnderCap(cost))return toast('Cost cap tidak cukup untuk fasilitas ini. Sisa '+fm(costCapRemaining())+'.');const before=S.m;_buyFWithCostCap(i);const paid=Math.max(0,before-S.m);if(paid){recordCostCapSpend(paid,'Fasilitas');auto();render() }};
const _startRDWithCostCap=startRD;
startRD=function(key,focus,mode='standard'){
 ensureCostCap();const part=rdPart(key);if(!part)return;const level=rdNextLevel(key,focus),cost=rdCost(part,level,mode);
 if(!canSpendUnderCap(cost))return toast('Cost cap tidak cukup untuk proyek R&D ini. Sisa '+fm(costCapRemaining())+'.');
 const before=S.m;_startRDWithCostCap(key,focus,mode);const paid=Math.max(0,before-S.m);if(paid){recordCostCapSpend(paid,'R&D');auto();render() }
};
const _buildRDWithCostCap=buildRD;
buildRD=function(id,w){
 ensureCostCap();const d=S.rdParts.find(p=>p.id==id);if(!d)return;
 const cars=w==='both'?[0,1]:[+w],todo=cars.filter(c=>EQ(c)[d.key]!==d.id),cost=rdBuildCost(d)*todo.length;
 if(!canSpendUnderCap(cost))return toast('Cost cap tidak cukup untuk produksi komponen. Sisa '+fm(costCapRemaining())+'.');
 const before=S.m;_buildRDWithCostCap(id,w);const paid=Math.max(0,before-S.m);if(paid){recordCostCapSpend(paid,'Produksi komponen');auto();render() }
};

/* Directional development of rival constructors, bounded by their own annual cost-cap plan. */

/* PU component reliability and the requested separate engine controls for each car. */
const _makeRaceStateWithPU=makeRaceState;
makeRaceState=function(ci){
 ensureAllPU();autoAIEngineChanges();
 const grid=S.wk&&Array.isArray(S.wk.grid)?S.wk.grid:null,penaltyMap={};
 if(grid){
  const adjusted=grid.map(g=>{const d=S.d[g.i];ensureDriverPU(d);const penalty=(d.pu.pendingGridPenalty||0)+(d.stewardGridPenalty||0);penaltyMap[g.i]=penalty;const effective=penalty>15?10000+g.g:g.g+penalty;return{...g,_penalty:penalty,_effective:effective}}).sort((a,b)=>a._effective-b._effective||a.g-b.g);
  S.wk.grid=adjusted.map((g,j)=>{const x={...g,g:j+1};delete x._effective;return x});
 }
 const r=_makeRaceStateWithPU(ci);
 if(r){r.stewardLog=[];r.gridPenaltyReport=[];(r.cars||[]).forEach(c=>{const d=S.d[c.i];ensureDriverPU(d);c.gridPenalty=penaltyMap[c.i]||0;c.puHealth=driverPUHealth(d);c.penalties=c.penalties||[];
  if(c.gridPenalty>0){const detail=`Grid penalty ${c.gridPenalty} posisi`;
   c.penalties.push({kind:'Power Unit / steward grid penalty',grid:c.gridPenalty,seconds:0,detail});r.gridPenaltyReport.push(`${d.n}: ${detail}.`);
   if(c.t===S.me)r.log.unshift(`${d.n} mendapat penalti grid ${c.gridPenalty} posisi; start dari P${c.g}.`);
  }
  d.pu.pendingGridPenalty=0;d.stewardGridPenalty=0;
 });r.log=r.log.slice(0,18)}
 return r;
};
const _lapWithPUWear=lap;
lap=function(){if(RS&&!RS.done)updatePUWearPerLap(RS);return _lapWithPUWear()};
const _raceLapTimeWithPUHealth=raceLapTime;
raceLapTime=function(c,r,neutral,k){const base=_raceLapTimeWithPUHealth(c,r,neutral,k);return base+Math.max(0,85-(c.puHealth==null?100:c.puHealth))*.0025};
const _finRWithStewards=finR;
finR=function(){if(RS&&!RS.done)applyRaceStewards(RS);return _finRWithStewards()};
const _vWWithEngineManager=vW;
vW=function(){return _vWWithEngineManager()+engineManagerMarkup()};
const _vUWithCostCap=vU;
vU=function(){return costCapPanelMarkup()+_vUWithCostCap()};
const _vRDWithCostCap=vRD;
vRD=function(){return costCapPanelMarkup()+_vRDWithCostCap()};

/* Qualifying impeding is rare and stored until the race grid is formed. */
const _buildQualGridWithStewards=buildQualGrid;
buildQualGrid=function(w){_buildQualGridWithStewards(w);stewardGridQualifying(w)};

/* Add penalty details to the archived race record after the core points/result calculation. */
const _doneWithPenaltyArchive=done;
done=function(ci,fin,meta={}){
 fin=(fin||[]).map(x=>{const live=RS&&RS.cars&&RS.cars.find(c=>c.i===x.i);return{...x,penalties:(x.penalties&&x.penalties.length?x.penalties:(live&&live.penalties)||[]),gridPenalty:x.gridPenalty||(live&&live.gridPenalty)||0}});
 const result=_doneWithPenaltyArchive(ci,fin,meta);
 const penalties=(fin||[]).flatMap(x=>(x.penalties||[]).map(p=>({driver:S.d[x.i]?.n||'-',team:TM[S.d[x.i]?.t??0]?.n||'-',kind:p.kind,seconds:p.seconds||0,grid:p.grid||0,detail:p.detail||''})));
 if(S.last)S.last.penalties=penalties;
 const rec=raceRecord(ci,S.rd);if(rec&&rec.race){rec.race.penalties=penalties;const byDriver=new Map((fin||[]).map(x=>[x.i,x.penalties||[]]));(rec.race.rows||[]).forEach(row=>{const pp=byDriver.get(row.i)||[];row.penaltyText=pp.map(p=>p.grid?`+${p.grid} grid`:p.seconds?`+${p.seconds}s`:'Warning').join(', ')||'—';row.penalties=simClone(pp)})}
 return result;
};
const _vRWithPenaltyReport=vR;
vR=function(){const base=_vRWithPenaltyReport();const list=S&&S.last&&S.last.penalties||[];const card=`<div class="card penaltyReport"><b class="h">Stewards · Penalty Report</b>${list.length?list.map(p=>`<div class="penaltyItem"><b>${p.driver}</b> · ${p.team}<br><small>${p.kind}: ${p.grid?`+${p.grid} posisi grid`:p.seconds?`+${p.seconds} detik`:'Peringatan tanpa penalti waktu'}${p.detail?' · '+p.detail:''}</small></div>`).join(''):'<p class="mu">Tidak ada penalti tambahan pada race terakhir. Penalti tyre compound dua jenis ban kering tetap dicatat terpisah bila berlaku.</p>'}</div>`;return card+base};

/* End-of-season team move, team-owned facilities/R&D and annual rule reset. */
const _nextSeasonWithCareerSystems=nextSeason;
nextSeason=function(){
 if(!S)return;ensureCostCap();const oldYear=S.y,oldTeam=S.me,target=S.pendingTeam==null?null:+S.pendingTeam;
 S.costCapHistory=S.costCapHistory||[];S.costCapHistory.push(simClone(S.costCap));
 _nextSeasonWithCareerSystems();
 if(target!=null&&target!==oldTeam&&TM[target])applyCareerTeamMove(oldTeam,target);
 ensureCostCap();S.costCap={year:S.y,limit:currentCostCapLimit(),spent:0,breakdown:{}};
 resetAIFinanceForSeason();resetPUForNewSeason();ensureAllPU();ensureCareerTeamAssets();
 auto();render();
 if(target!=null&&target!==oldTeam)toast(`Musim ${S.y}: kamu resmi bergabung dengan ${TM[target].n}.`);
};
const _vBWithCareerSystems=vB;
vB=function(){
 ensureCostCap();ensureAIDevelopment();
 const base=_vBWithCareerSystems();
 return careerTeamMoveMarkup()+base+'<details class="more"><summary>Keuangan dan perkembangan tim lain</summary>'+costCapPanelMarkup()+aiDevelopmentSummary()+'</details>';
};

/* Current race penalty notices and engine reliability are also shown in the live race view. */
const _vRaceWithPUWarnings=vRace;
vRace=function(){
 let html=_vRaceWithPUWarnings();
 if(scr==='race'&&RS&&!RS.done){
  const health=RS.cars.filter(c=>c.t===S.me&&!c.x).map(c=>{const d=S.d[c.i];return `<span>${d.n}: <b>${Math.round(c.puHealth||driverPUHealth(d))}% PU health</b></span>`}).join('');
  const pending=RS.gridPenaltyReport&&RS.gridPenaltyReport.length?`<p class="rd">${RS.gridPenaltyReport.join('<br>')}</p>`:'';
  const panel=`<div class="card puLiveStatus"><b>Power Unit Reliability</b><div class="strategyMeta">${health}</div>${pending}<small>Health turun seiring jarak balapan dan memengaruhi risiko masalah mekanis.</small></div>`;
  const anchor='<div class="card liveCompare';
  if(html.includes(anchor))html=html.replace(anchor,panel+anchor);else{const at=html.indexOf('<div class="sc"><table class="tb"><tr><th>P</th>');if(at>=0)html=html.slice(0,at)+panel+html.slice(at)}
 }
 return html;
};

/* Final initialisation for old saves and fresh careers. */
if(S){ensureCostCap();ensureAIDevelopment();ensureAllPU();ensureCareerTeamAssets()}

applyTheme();render();
</script></body></html>
