.btn{background:var(--ac);color:#fff;border:2px solid var(--ac)}

.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:14px;margin:10px 0}
.up{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}

.big{font-size:24px}.mn{font:700 22px "Chakra Petch",system-ui,sans-serif;color:var(--ok)}
.foot{position:sticky;bottom:0;padding:14px 0 6px;background:linear-gradient(transparent,var(--bg) 35%);text-align:center}

.cnt{font:700 22px "Chakra Petch",sans-serif;margin-right:6px}.cnt.ok{color:var(--ok)}
.sc{overflow-x:auto}
.tb{width:100%;border-collapse:collapse;background:var(--pn);border-radius:10px}
.tb td,.tb th{padding:7px 9px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}
.tb tr.me{background:color-mix(in srgb,var(--ac) 16%,transparent)}
.chip{display:inline-block;width:5px;height:16px;border-radius:2px;margin-right:8px;vertical-align:-3px}
.gn{color:var(--ok)}.rd{color:var(--ac)}
.cal{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.cal span{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--pn2);color:var(--mu)}
.cal .dn{text-decoration:line-through}.cal .cur{background:var(--ac);color:#fff}
.pips{letter-spacing:2px;color:var(--ac)}
.sl{margin:12px 0}.sr{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}.sr input{width:100%;accent-color:var(--ac)}
.sel{outline:3px solid var(--ac)}
.ty{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;font:700 11px system-ui;margin-right:4px}
.ty.S{background:#e10600;color:#fff}.ty.M{background:#f5c400;color:#000}.ty.H{background:#d9d9d9;color:#000}.ty.I{background:#2f9e44;color:#fff}.ty.W{background:#1e6fd9;color:#fff}

textarea{width:100%;margin:8px 0;background:var(--pn2);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px;font:12px monospace}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
#toast.on{opacity:1;transform:translate(-50%,0)}
.facGroup{margin:16px 0 6px}.facGrid,.rdGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.facCard,.rdCard{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:12px;min-width:0}
.facCard .row,.rdCard .row{margin-top:8px}.lvl{letter-spacing:2px;color:var(--ac);white-space:nowrap}
.rdCard select{width:100%;margin:8px 0;padding:9px;border-radius:8px;border:1px solid var(--ln);background:var(--pn2);color:var(--tx);font:inherit}
.progress{height:8px;border-radius:8px;background:var(--pn2);overflow:hidden;margin:8px 0}.progress span{display:block;height:100%;background:var(--ok)}
.effect{font-size:12px;color:var(--mu);line-height:1.5}.tag{display:inline-block;padding:3px 7px;border-radius:5px;background:var(--pn2);font-size:11px;color:var(--mu);margin:2px 3px 2px 0}

.marketGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.marketCard{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:12px;min-width:0}

.avail.free{background:#d8f1e3;color:#075d32}.avail.locked{background:#fbe5d9;color:#843a12}

.raceDockInner{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:7px;overflow-x:auto;white-space:nowrap}
.raceDock button{flex:none;padding:8px 11px;font-size:13px;border-radius:8px}
.raceDock .dockLabel{font-size:11px;color:var(--mu);font-weight:700;margin:0 2px}
.raceScrollPad{height:92px}
.mandateBar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.mandateBar>div{background:var(--pn2);border-radius:8px;padding:8px}

 else{const i=S.cal[S.rd],c=C[i];h=`<div class="card"><div class="trkSide">${trkSvg(i,"",1)}</div><small>Race ${S.rd+1} dari ${n}</small><h2 class="h">${c.n} GP</h2><p class="mu">${c.c}. Aero ${'●'.repeat(c.a)} Power ${'●'.repeat(c.p)}</p><p>Performa mobilmu di sini: <b>${perf(S.me,i).toFixed(1)}</b>. Konstruktor: <b>P${rk}</b> dengan ${S.t[S.me].p} poin.</p><div class="row"><button class="btn" onclick="${S.wk?"setT('w')":"startWk()"}">${S.wk?'⏭ Lanjut weekend':'🏁 Mulai weekend race'}</button><button class="btn2" onclick="doRace()">⚡ Sim cepat race</button><button class="btn2" onclick="doAll()">⏩ Sampai akhir musim</button></div></div>`}
 return h+(S.tl&&S.tl.length?`<div class="card"><b>Bursa transfer ${S.y}</b>${S.tl.map(x=>`<br><small>${x}</small>`).join('')}</div>`:'')+(S.sp?`<div class="card"><b>Sponsor ${S.sp.n}</b>${S.sp.g.map(g=>`<br><small>${okG(g)?'✔':'○'} ${gtx(g)}, bonus ${fm(g.b)}</small>`).join('')}</div>`:'')+`<div class="card"><b>Pembalap tim</b>${mine().map(d=>`<br><small>${d.n}: kepuasan ${Math.round(d.h||70)}%, kontrak ${d.c==null?2:d.c} musim</small>`).join('')}</div>`+`<div class="card"><b>Kalender ${S.y}</b><div class="cal">${S.cal.map((i,j)=>`<span class="${j<S.rd?'dn':j==S.rd?'cur':''}">${j+1}. ${C[i].n}</span>`).join('')}</div></div>`+(S.h.length?`<div class="card"><b>Riwayat musim</b>${S.h.map(x=>`<br><small>${x.y}: juara ${x.dc}, konstruktor ${x.tc}, tim kamu P${x.r}</small>`).join('')}</div>`:'')}

const fl=i=>S.f[[0,1,2,2][i]];
const gain=i=>Math.max(.4,(97-S.t[S.me].c[i])*.1)*(1+.12*fl(i));

function facilityCost(i){const l=S.f[i],mul=[1,1.35,1.75,2.25,2.8][l];return Math.round(FACILITIES[i].cost*mul*DM())}
function maintenancePerRace(){const gross=S.f.reduce((sum,l,i)=>sum+l*FACILITIES[i].maint,0);return Math.max(0,gross*(1-S.f[20]*.025))}
function vU(){const c=S.t[S.me].c;
 return `<h3 class="h">Upgrade mobil</h3><p class="mu">Upgrade langsung meningkatkan rating dasar mobil. R&D di tab terpisah digunakan untuk membuat komponen spesialis dan paket sirkuit.</p>`+CL.map((n,i)=>{const k=ucost(i);return `<div class="card up"><div style="flex:1"><b>${n}</b> <span class="mu">${c[i].toFixed(1)}</span><div class="st" style="grid-template-columns:1fr;--k:var(--ac);margin-top:6px"><i><u style="width:${(c[i]-50)*2}%"></u></i></div></div><button class="btn2" ${S.m<k||c[i]>=99?'disabled':''} onclick="buyU(${i})">+${gain(i).toFixed(1)} untuk ${fm(k)}</button></div>`}).join('')
 +`<h3 class="h">Facilities</h3><div class="card"><b>Biaya operasional fasilitas</b><div class="mn">${fm(maintenancePerRace())} / race</div><small>Setiap level menambah maintenance. Logistics & Operations Center dapat menekan biaya ini.</small></div>`+FACILITY_GROUPS.map(group=>`<h3 class="h facGroup">${group}</h3><div class="facGrid">${FACILITIES.map((f,i)=>({f,i})).filter(x=>x.f.g==group).map(({f,i})=>{const l=S.f[i],k=facilityCost(i);return `<div class="facCard"><div class="up"><b>${f.n}</b><span class="lvl">${'■'.repeat(l)}${'□'.repeat(5-l)}</span></div><p class="effect">${f.d}</p><small>${f.e}</small><div class="row">${l<5?`<button class="btn2" ${S.m<k?'disabled':''} onclick="buyF(${i})">Upgrade Lv.${l+1} · ${fm(k)}</button>`:'<b>MAX LEVEL</b>'}</div></div>`}).join('')}</div>`).join('')}

function rdPart(key){return RD_CATALOG.find(p=>p.key==key)}
function rdFocus(part,id){return part.focus.find(f=>f.id==id)||part.focus[0]}
function rdNextLevel(key,focus){return Math.min(6,1+S.rdParts.filter(p=>p.key==key&&p.focus==focus).reduce((m,p)=>Math.max(m,p.level),0))}
function rdSlots(){return Math.min(4,1+Math.floor(S.f[5]/2)+Math.floor(S.f[18]/3))}
function rdDiscount(){return Math.max(.68,1-S.f[7]*.025-S.f[20]*.015)}
function rdCost(part,level,mode='standard'){return Math.round(part.base*(.72+level*.43)*DM()*rdDiscount()*(mode=='experimental'?1.2:1))}
function rdWeeks(part,level,mode='standard'){const specialist=S.f[part.fac]*.18,academy=S.f[18]*.13,cfd=(part.g=='Aerodynamics'||part.g=='Circuit Packages'?S.f[5]*.16:0),manufacture=S.f[7]*.05;return Math.max(1,Math.round(part.weeks+level*.25-specialist-academy-cfd-manufacture)+(mode=='experimental'?1:0))}
function rdRequirements(part,level){const req=[];const primary=Math.max(0,level-2);if(primary)req.push([part.fac,primary]);if((part.g=='Aerodynamics'||part.g=='Circuit Packages')&&level>=3)req.push([5,level-2]);return req}
function rdReqText(part,level){const req=rdRequirements(part,level);return req.length?'Prasyarat: '+req.map(([i,l])=>FACILITIES[i].n+' Lv.'+l).join(' dan '):'Prasyarat fasilitas: tidak ada untuk level awal.'}
function rdCanStart(part,focus,mode='standard'){const level=rdNextLevel(part.key,focus),cost=rdCost(part,level,mode);if(level>5)return 'Fokus ini sudah mencapai level maksimum.';if(S.rdProjects.length>=rdSlots())return 'Slot R&D penuh. Upgrade CFD Supercomputer atau Engineering Academy.';if(S.rdProjects.some(p=>p.key==part.key&&p.focus==focus))return 'Fokus ini sedang diteliti.';const req=rdRequirements(part,level).filter(([i,l])=>S.f[i]<l);if(req.length)return 'Butuh '+req.map(([i,l])=>FACILITIES[i].n+' Lv.'+l).join(' dan ')+'.';if(S.m<cost)return 'Dana belum cukup. Butuh '+fm(cost)+'.';return ''}
function startRD(key,focus,mode='standard'){const part=rdPart(key);if(!part)return;const f=rdFocus(part,focus),level=rdNextLevel(key,f.id),why=rdCanStart(part,f.id,mode);if(why){toast(why);return}const cost=rdCost(part,level,mode),weeks=rdWeeks(part,level,mode);S.m-=cost;S.rdProjects.push({id:String(Date.now())+Math.random().toString(36).slice(2,6),key,focus:f.id,level,mode,total:weeks,left:weeks,cost});auto();toast('Proyek '+part.n+' dimulai');render()}
function advanceResearch(){if(!S.rdProjects||!S.rdProjects.length)return;const remain=[];S.rdProjects.forEach(project=>{project.left--;if(project.left<=0){const part=rdPart(project.key),focus=rdFocus(part,project.focus);if(project.mode=='experimental'&&Math.random()<.2){S.rdLog.unshift('Eksperimen gagal: '+part.n+' · '+focus.n+'. Dana dan waktu proyek tidak kembali.')}else{const stats={},mult=project.mode=='experimental'?1.28:1;Object.keys(STAT_LABELS).forEach(k=>stats[k]=(focus.s[k]||0)*project.level*.62*mult);if(project.mode=='experimental')stats.reliability=(stats.reliability||0)-.9;const design={id:String(Date.now())+Math.random().toString(36).slice(2,7),key:project.key,focus:project.focus,level:project.level,name:part.n+' · '+focus.n+' Mk.'+project.level+(project.mode=='experimental'?' EX':'') ,stats,fit:focus.fit,mode:project.mode,created:S.y+' / race '+(S.rd+1)};S.rdParts.push(design);S.rdLog.unshift('Selesai: '+design.name)}S.rdLog=S.rdLog.slice(0,8)}else remain.push(project)});S.rdProjects=remain}

function rdStatsText(stats){return Object.entries(stats).filter(([,v])=>Math.abs(v)>.05).map(([k,v])=>(v>0?'+':'')+v.toFixed(1)+' '+STAT_LABELS[k]).join(' · ')||'Tidak ada efek statistik'}
function rdBonus(t,ci,wet){if(t!=S.me)return 0;const c=C[ci],trackHigh=c.a>=3,trackLow=c.p>=3&&c.a==1;let b=0;RD_CATALOG.forEach(part=>{const d=rdInstalled(part.key);if(!d)return;if(part.pkg=='high'&&!trackHigh)return;if(part.pkg=='low'&&!trackLow)return;if(part.pkg=='wet'&&!wet&&!(S.wk&&S.wk.fc>=30))return;const x=d.stats;b+=x.speed*(c.p>=3?.23:.11)+x.accel*.13+x.low*(c.a>=3?.19:.08)+x.med*(c.a>=2?.16:.08)+x.high*(c.a>=2?.16:.07)+x.grip*.10+x.stability*.08+x.tyre*.05+x.reliability*.035+x.cooling*.025});return b}
function rdStat(key){let n=0;RD_CATALOG.forEach(part=>{const d=rdInstalled(part.key);if(d)n+=d.stats[key]||0});return n}
function rdWetBonus(t,ci){if(t!=S.me||!rdInstalled('pkgWet'))return 0;const d=rdInstalled('pkgWet');return d.stats.grip*.15+d.stats.stability*.11+d.stats.tyre*.08}

function rdCard(part){const focus=part.focus[0],level=rdNextLevel(part.key,focus.id),cost=rdCost(part,level),weeks=level<=5?rdWeeks(part,level):0,why=level<=5?rdCanStart(part,focus.id):'Semua fokus sudah maksimum',available=part.focus.some(f=>!rdCanStart(part,f.id)),current=rdInstalled(part.key);return `<div class="rdCard"><div class="up"><b>${part.n}</b><span class="tag">${part.g}</span></div><p class="effect">${part.d}</p><small>Terpasang: ${current?current.name:'Standard / Stock'}</small><label><small>Pilih fokus pengembangan</small></label><select id="focus-${part.key}" onchange="updateRDPreview('${part.key}',this.value)">${part.focus.map(f=>`<option value="${f.id}">${f.n} — ${f.d}</option>`).join('')}</select><small id="preview-${part.key}">Target Mk.${level>5?'MAX':level} · ${fm(cost)} · ${weeks||'-'} race</small><br><small id="fit-${part.key}">Cocok untuk: ${focus.fit}</small><br><small id="req-${part.key}">${rdReqText(part,Math.min(5,level))}</small><label><small>Metode pengembangan</small></label><select id="mode-${part.key}" onchange="updateRDPreview('${part.key}',document.getElementById('focus-${part.key}').value)"><option value="standard">Standard · stabil</option><option value="experimental">Experimental · +28% efek, +20% biaya, +1 race, risiko gagal 20%</option></select><div class="row"><button class="btn2" ${available?'':'disabled'} onclick="startRD('${part.key}',document.getElementById('focus-${part.key}').value,document.getElementById('mode-${part.key}').value)">Mulai R&D</button></div>${available?'':`<small class="rd">${why||'Belum bisa memulai proyek ini.'}</small>`}</div>`}

 ['Aerodynamics','Chassis','Power Unit','Circuit Packages'].map(group=>`<h3 class="h">${group}</h3><div class="rdGrid">${RD_CATALOG.filter(p=>p.g==group).map(rdCard).join('')}</div>`).join('')+

 `<h3 class="h">Research Log</h3><div class="card">${S.rdLog&&S.rdLog.length?S.rdLog.map(x=>`<small>✓ ${x}</small>`).join('<br>'):'<small>Belum ada proyek yang selesai.</small>'}</div>`}

function perf(t,ci){const T=S.t[t],c=C[ci];let r=(T.c[0]*c.a+T.c[1]*c.p+T.c[2]*2)/(c.a+c.p+2);if(t==S.me)r+=S.f[3]*.5+S.f[12]*.08+S.f[14]*.08+DB()+rdBonus(t,ci,false)+(S.wk?su(ci)-1:0);return r}
const WK=['FP1','FP2','FP3','Q1','Q2','Q3','Race'];
const SU=[{k:'Front Wing',min:1,max:11,st:.5,def:6,f:v=>(+v).toFixed(1)},{k:'Rear Wing',min:0,max:20,st:1,def:10,f:v=>v+'°'},{k:'Anti-Roll',min:1,max:9,st:1,def:5,f:v=>v+':'+(10-v)},{k:'Camber',min:-4,max:-2,st:.05,def:-3,f:v=>(+v).toFixed(2)+'°'},{k:'Toe-Out',min:0,max:1,st:.05,def:.5,f:v=>(+v).toFixed(2)+'°'}];
const FB=[{hi:['Belakang licin dan oversteer saat masuk tikungan.','kurangi Front Wing'],lo:['Understeer di tikungan lambat, depan kurang grip.','tambah Front Wing']},{hi:['Terlalu banyak drag, kita kalah kecepatan di lurusan.','kurangi Rear Wing'],lo:['Belakang gelisah di tikungan cepat dan traksi keluar tikungan kurang.','tambah Rear Wing']},{hi:['Understeer di tengah tikungan, mobil sulit berbelok.','geser anti-roll ke arah belakang'],lo:['Belakang terlalu lincah, mudah oversteer saat keluar tikungan.','geser anti-roll ke arah depan']},{hi:['Grip tikungan kurang, ban depan tidak bekerja penuh.','tambah camber negatif'],lo:['Sisi dalam ban depan cepat aus dan mobil kurang stabil di lurusan.','kurangi camber negatif']},{hi:['Mobil gelisah di lurusan dan ban depan cepat panas.','kurangi toe-out'],lo:['Respons masuk tikungan kurang tajam.','tambah toe-out']}];
const sClamp=(v,a,b)=>Math.max(a,Math.min(b,v)),sSnap=(v,t)=>Math.round(v/t)*t;

const ideal=ci=>{const c=C[ci];return[sSnap(sClamp([3.5,6,8.5][c.a-1]+((ci*13)%5-2)*.5,1,11),.5),sClamp([6,11,16][c.a-1]-(c.p-2)*2+(ci*7)%5-2,0,20),4+(ci*5+S.y)%4,sSnap(-3.8+((ci*11)%9)*.1,.05),sSnap(.15+((ci*3)%8)*.05,.05)]};
const setupDiff=ci=>{const d=ideal(ci);if(!S.wk.su||S.wk.su.length!==SU.length)S.wk.su=SU.map(p=>p.def);return S.wk.su.reduce((a,v,j)=>a+Math.abs(v-d[j])/(SU[j].max-SU[j].min)*100,0)/SU.length};
const su=ci=>2-setupDiff(ci)*.06;
function feedback(w,ci,sd){
 const id=ideal(ci),nd=(v,j,n)=>(v-id[j])/(SU[j].max-SU[j].min)*100+R()*n;
 const cars=[0,1].map(q=>S.d.find(d=>d.t===S.me&&d.seat===q)||mine()[q]).filter(Boolean);
 const dr=cars.map((d,q)=>{const n=sd*(1.3-(d.s-70)/60),h=w.su.map((v,j)=>nd(v,j,n)),bad=h.map((x,j)=>({x,j})).filter(o=>Math.abs(o.x)>=7).sort((a,b)=>Math.abs(b.x)-Math.abs(a.x)).slice(0,2),av=h.reduce((a,x)=>a+Math.abs(x),0)/h.length;
  const op=av<8?'Mobil terasa enak.':av<18?'Lumayan, tapi masih ada yang mengganjal.':'Mobilnya sulit dikendarai.';
  return{n:d.n,s:q+1,t:op+' '+(bad.length?bad.map(o=>FB[o.j][o.x>0?'hi':'lo'][0]).join(' ')+' Saran saya: '+bad.map(o=>FB[o.j][o.x>0?'hi':'lo'][1]).join(' dan ')+'.':'Tidak ada keluhan berarti, lanjutkan seperti ini.')}});
 const en=SU.map((p,j)=>{const x=nd(w.su[j],j,sd*.6);if(Math.abs(x)<7)return p.k+': pertahankan '+p.f(w.su[j]);const t=sSnap(sClamp(w.su[j]-x/100*(p.max-p.min)*.7,p.min,p.max),p.st);return p.f(t)===p.f(w.su[j])?p.k+': pertahankan '+p.f(w.su[j]):p.k+': '+p.f(w.su[j])+' menjadi '+p.f(t)});
 return{dr,en,conf:sd>12?'rendah':sd>6?'sedang':'tinggi'}}
const fbMarkup=w=>{const f=w.fb;if(!f||!f.dr)return '<small>Jalankan FP1–FP3 untuk mendapat masukan driver dan engineer. Setup terkunci setelah FP3.</small>';return `<div style="margin-top:10px"><b>Masukan setelah ${w.ses}</b>${f.dr.map(d=>`<p style="margin:8px 0 0"><b>Mobil ${d.s}, ${d.n}:</b><br><small>“${d.t}”</small></p>`).join('')}<p style="margin:10px 0 0"><b>Engineer / Set-up Management</b> <small>(keyakinan data ${f.conf})</small><br>${f.en.map(x=>`<small>${x}</small>`).join('<br>')}</p></div>`};
const slMarkup=(w,lock)=>SU.map((p,j)=>`<div class="sl"><b>${p.k}</b> <span id="sv${j}">${p.f(w.su[j])}</span><div class="sr"><small>${p.f(p.min)}</small><input type="range" min="${p.min}" max="${p.max}" step="${p.st}" value="${w.su[j]}" ${lock?'disabled':''} oninput="setU(${j},this.value)"><small>${p.f(p.max)}</small></div></div>`).join('');
const bs=(i,ci)=>{const d=S.d[i];return perf(d.t,ci)*.65+(d.s+(d.t==S.me?((d.h||70)-60)*.1:0))*.35};
function raceRecord(ci=S.cal[S.rd],rd=S.rd+1){if(!Array.isArray(S.raceHistory))S.raceHistory=[];let rec=S.raceHistory.find(x=>x.y==S.y&&x.rd==rd);if(!rec){rec={y:S.y,rd,ci,sessions:{},race:null};S.raceHistory.push(rec)}rec.ci=ci;rec.sessions=rec.sessions||{};return rec}
function saveSessionResult(key,rows){const sorted=rows.slice().sort((a,b)=>a.time-b.time),best=sorted.length?sorted[0].time:0,rec=raceRecord();rec.sessions[key]=sorted.map((r,j)=>{const d=S.d[r.i];return{i:r.i,name:d.n,team:d.t,teamName:TM[d.t].n,teamColor:TM[d.t].k,pos:j+1,time:r.time,gap:j?Math.max(0,r.time-best):0,status:r.status||''}});}
function practiceRows(ci,sessionNo){const base=78+(ci*7)%25,k=[.6,1,1.5][ST.chaos],noise=[.22,.18,.14][sessionNo-1];return S.d.map((d,i)=>({i,time:base-(bs(i,ci)-70)*.045+R()*noise*k+(sessionNo-1)*.012})).sort((a,b)=>a.time-b.time)}
function qualiRows(ci,entrants,round){const base=78+(ci*7)%25,k=[.6,1,1.5][ST.chaos];return entrants.map(i=>({i,b:bs(i,ci),time:base-(bs(i,ci)-70)*.047+R()*.12*k+(round-1)*.006})).sort((a,b)=>a.time-b.time)}
function buildQualGrid(w){const q1=w.qual.Q1||[],q2=w.qual.Q2||[],q3=w.qual.Q3||[];w.grid=[...q3.map((r,j)=>({...r,g:j+1})),...q2.slice(10).map((r,j)=>({...r,g:11+j})),...q1.slice(16).map((r,j)=>({...r,g:17+j}))].sort((a,b)=>a.g-b.g)}
function runQualRound(w,ci,round){w.qual=w.qual||{};const name='Q'+round;let entrants=round==1?S.d.map((d,i)=>i):round==2?(w.qual.Q1||[]).slice(0,16).map(r=>r.i):(w.qual.Q2||[]).slice(0,10).map(r=>r.i);let rows=qualiRows(ci,entrants,round);rows.forEach((r,j)=>r.status=round==1?(j<16?'Lolos Q2':'Eliminasi Q1'):round==2?(j<10?'Lolos Q3':'Eliminasi Q2'):(j==0?'Pole position':'Lolos Q3'));w.qual[name]=rows;w.tb=rows.map(r=>({i:r.i,time:r.time,gap:r.time-rows[0].time,status:r.status}));w.ses=name;saveSessionResult(name,rows);if(round==3)buildQualGrid(w)}
function startWk(){S.wk={st:0,su:SU.map(p=>p.def),fb:null,tb:null,grid:null,qual:{},ses:'',fc:[0,5,10,20,30,45,60,80][Math.random()*8|0]};auto();setT('w');scrollTo(0,0)}

function vW(){const w=S.wk;if(!w)return `<div class="card">Belum ada weekend berjalan. Mulai dari tab Beranda.</div>`;const c=C[S.cal[S.rd]],lock=w.st>=3;const fb=fbMarkup(w);const sl=slMarkup(w,lock);const tb=w.tb?`<h3 class="h">Hasil ${w.ses}</h3><div class="sc"><table class="tb"><tr><th>Pos</th><th>Pembalap</th><th>Tim</th><th>Waktu</th><th>Gap</th><th>Status</th></tr>${w.tb.map((r,j)=>{const d=S.d[r.i];return `<tr class="${d.t==S.me?'me':''}"><td>${j+1}</td><td>${r.name||d.n}${r.substitute?' <small>(F2 Academy)</small>':''}</td><td><i class="chip" style="background:${TM[d.t].k}"></i>${TM[d.t].n}</td><td>${fmt(r.time)}</td><td>${j?'+'+r.gap.toFixed(3)+'s':'Tercepat'}</td><td>${r.status||'—'}</td></tr>`}).join('')}</table></div>`:'';const current=WK[w.st]||'Race';const mandate=currentMandateTotal()<4;const choice=w.fp1Choice||{seat:mandateSeatDefault(),driverId:S.academyPool[0]?.id};const subPanel=w.st===0?`${fp1MandateMarkup()}<div class="card"><b>FP1 Rookie Substitution</b><p class="mu">${mandate?'Pilih kursi mobil dan pembalap akademi F2 untuk menggantikan satu driver reguler selama FP1, atau pilih "Tidak menurunkan reserve driver" selama sisa race masih cukup untuk memenuhi kewajiban musim ini.':'Kewajiban musim ini selesai. Substitusi tambahan tetap boleh dilakukan.'}</p><div class="row"><label style="flex:1;min-width:130px"><small>Mobil yang disubstitusi</small><select style="width:100%;padding:9px;border-radius:8px;background:var(--pn2);color:var(--tx);border:1px solid var(--ln)" onchange="setFP1Choice('seat',this.value)"><option value="0" ${choice.seat===0?'selected':''} ${mandate&&(S.fp1Mandate[0]||0)>=2?'disabled':''}>Mobil 1 · ${S.d.find(d=>d.t===S.me&&d.seat===0)?.n||'Driver 1'} (${S.fp1Mandate[0]||0}/2)</option><option value="1" ${choice.seat===1?'selected':''} ${mandate&&(S.fp1Mandate[1]||0)>=2?'disabled':''}>Mobil 2 · ${S.d.find(d=>d.t===S.me&&d.seat===1)?.n||'Driver 2'} (${S.fp1Mandate[1]||0}/2)</option><option value="none" ${choice.seat==='none'?'selected':''}>Tidak menurunkan reserve driver</option></select></label><label style="flex:1;min-width:170px"><small>Reserve / F2 Academy</small><select style="width:100%;padding:9px;border-radius:8px;background:var(--pn2);color:var(--tx);border:1px solid var(--ln)" onchange="setFP1Choice('driverId',this.value)" ${choice.seat==='none'?'disabled':''}>${S.academyPool.map(d=>`<option value="${d.id}" ${d.id===choice.driverId?'selected':''}>${d.n} · OVR ${d.s}</option>`).join('')}</select></label></div></div>`:'';return `<div class="card"><b class="h">${c.n} GP</b><br><small>Perkiraan cuaca race day: peluang hujan ${w.fc||0}% ${(w.fc||0)>=60?'🌧':(w.fc||0)>=30?'⛅':'☀'}</small><div class="cal">${WK.map((n,j)=>`<span class="${j<w.st?'dn':j===w.st?'cur':''}">${n}</span>`).join('')}</div><div class="row"><button class="btn" onclick="runSes()">▶ ${w.st>=6?'Mulai Race':'Jalankan '+current}</button></div></div>${subPanel}<div class="card"><b>Set-up mobil</b>${lock?' <small>(terkunci setelah FP3)</small>':''}${sl}${fb}</div>${tb}`}
function vB(){const n=S.cal.length,rk=ts().findIndex(x=>x.i===S.me)+1;let h;if(S.rd>=n){const dc=ds()[0],tc=ts()[0];h=`<div class="card"><h2 class="h">Musim ${S.y} selesai</h2><p>Juara dunia: <b>${dc?.n||'-'}</b> (${dc?TM[dc.t].n:'-'})<br>Juara konstruktor: <b>${TM[tc?.i||0].n}</b><br>Tim kamu finis <b>P${rk}</b>, hadiah ${fm(150-(rk-1)*11)}${S.sp?`, bonus sponsor ${fm(spB().t)}`:''}</p><button class="btn" onclick="nextSeason()">Lanjut ke musim ${S.y+1}</button></div>`}else{const i=S.cal[S.rd],c=C[i];h=`<div class="card"><div class="trkSide">${trkSvg(i,"",1)}</div><small>Race ${S.rd+1} dari ${n}</small><h2 class="h">${c.n} GP</h2><p class="mu">${c.c}. Aero ${'●'.repeat(c.a)} Power ${'●'.repeat(c.p)}</p><p>Performa mobilmu di sini: <b>${perf(S.me,i).toFixed(1)}</b>. Konstruktor: <b>P${rk}</b> dengan ${S.t[S.me].p} poin.</p><div class="row"><button class="btn" onclick="${S.wk?"setT('w')":"startWk()"}">${S.wk?'Lanjut weekend':'Mulai weekend race'}</button><button class="btn2" onclick="doRace()">Sim cepat race</button><button class="btn2" onclick="doAll()">Sampai akhir musim</button></div></div>`}return h+fp1MandateMarkup()+(S.retirementLog&&S.retirementLog.length?`<div class="card"><b>Berita karier / pensiun</b>${S.retirementLog.slice(0,5).map(x=>`<br><small>${x}</small>`).join('')}</div>`:'')+(S.tl&&S.tl.length?`<div class="card"><b>Bursa transfer ${S.y}</b>${S.tl.map(x=>`<br><small>${x}</small>`).join('')}</div>`:'')+(S.sp?`<div class="card"><b>Sponsor ${S.sp.n}</b>${S.sp.g.map(g=>`<br><small>${okG(g)?'✔':'○'} ${gtx(g)}, bonus ${fm(g.b)}</small>`).join('')}</div>`:'')+`<div class="card"><b>Pembalap tim</b>${mine().map(d=>`<br><small>${d.n}: usia ${d.age||'-'}, OVR ${playerOVR(d)}, kepuasan ${Math.round(d.h||70)}%, kontrak ${d.c==null?2:d.c} musim</small>`).join('')}</div><div class="card"><b>Kalender ${S.y}</b><div class="cal">${S.cal.map((i,j)=>`<span class="${j<S.rd?'dn':j===S.rd?'cur':''}">${j+1}. ${C[i].n}</span>`).join('')}</div></div>`+(S.h.length?`<div class="card"><b>Riwayat musim</b>${S.h.map(x=>`<br><small>${x.y}: juara ${x.dc}, konstruktor ${x.tc}, tim kamu P${x.r}</small>`).join('')}</div>`:'')}
function fastestLapData(r){const c=(r.cars||[]).filter(x=>isFinite(x.bestLap)).sort((a,b)=>a.bestLap-b.bestLap)[0];return c?{i:c.i,name:S.d[c.i].n,teamName:TM[S.d[c.i].t].n,time:c.bestLap,lap:c.bestLapLap}:null}
function vRace(){const r=RS,c=C[r.ci],ord=[...r.cars.filter(x=>!x.x).sort((p,q)=>p.tot-q.tot),...r.cars.filter(x=>x.x).sort((p,q)=>q.xl-p.xl)],running=ord.filter(x=>!x.x),L=running[0],fast=fastestLapData(r);const pc=ord.map((x,j)=>({...x,j})).filter(x=>x.t===S.me).map(x=>{const rem=tyreRemaining(x),wear=Math.round(100-rem),grip=x.x?0:driverGripScore(x,r);return `<div class="card up"><div style="flex:1;min-width:220px">${av(S.d[x.i].n,TM[x.t].k,30)}<b>${S.d[x.i].n}</b> <small>P${x.j+1}</small> ${x.x?'<b class="rd">DNF</b>':`<span class="ty ${x.ty}">${x.ty}</span><small>Umur ${x.age} lap · Keausan ${wear}% · Grip ${grip}/100 · ${x.q?'Pit berikutnya: '+x.q+'. ':''}Dipakai: ${x.u||'-'}${!r.everWet&&x.u.length<2?'. Jika balapan tetap kering sampai finis, wajib memakai 2 jenis ban kering. Jika hujan turun, aturan ini otomatis gugur.':''}${x.pl.length?'. Rencana: '+x.pl.map(p=>`lap ${p[0]} ${p[1]}`).join(', '):''}</small>${tyreWearMarkup(x)}`}</div>${x.x?'':`<div class="row" style="margin:0">${['S','M','H','I','W'].map(t=>`<button class="btn2" onpointerdown="pit(${x.i},'${t}')">${r.lap?'Pit ':'Start '}${t}</button>`).join('')}${r.lap?'':['1 stop M-H','2 stop S-M-H','Start H-M','Basah I-M'].map((n,k)=>`<button class="btn2" onpointerdown="plan(${x.i},${k})">${n}</button>`).join('')}${x.q?`<button class="btn2" onpointerdown="pit(${x.i},null)">Batal</button>`:''}</div>`}</div>`}).join('');const timing=ord.map((x,j)=>{const ix=running.indexOf(x),prev=ix>0?running[ix-1]:null,rem=tyreRemaining(x);return `<tr class="${x.t===S.me?'me':''}"><td>${x.x?'-':j+1}</td><td><i class="chip" style="background:${TM[x.t].k}"></i>${av(S.d[x.i].n,TM[x.t].k,22)}${x.n}</td><td>${x.x?'DNF':prev?intervalText(x,prev,r):'Leader'}</td><td>${x.x?'DNF':x===L?'Leader':intervalText(x,L,r)}</td><td>${x.last?fmt(x.last):'—'}</td><td>${x.bestLap<Infinity?fmt(x.bestLap):'—'}</td><td><span class="ty ${x.ty}">${x.ty}</span>${x.age}</td><td class="wearCell">${x.x?'—':`${rem}%`}${x.x?'':`<span class="wearLine"><i style="width:${rem}%;background:${rem>50?'var(--ok)':rem>25?'#d19b00':'var(--ac)'}"></i></span>`}</td></tr>`}).join('');const dock=`<div class="raceDock"><div class="raceDockInner"><span class="dockLabel">RACE CONTROL</span><button class="btn ${r.pz?'':'btn2'}" onpointerdown="tg()">${r.pz?(r.lap?'▶ Lanjut':'▶ Mulai'):'⏸ Jeda'}</button><span class="dockLabel">SPEED</span>${['Lambat','Normal','Cepat','Sangat cepat','Kilat'].map((l,i)=>`<button class="btn2 ${ST.sp===i?'on':''}" onpointerdown="spd(${i})">${l}</button>`).join('')}<button class="btn2" onpointerdown="skipR()">Selesaikan Race</button></div></div>`;return `<div class="hd" style="--k:${TM[S.me].k}"><div><b class="h big">${c.n} GP</b><br><small>Lap ${r.lap} dari ${r.laps}. ${['Kering','Gerimis','Hujan deras'][r.wt]}. Peluang hujan ${r.fc}%</small></div></div>${r.sc?`<div class="bn ${r.sc}">${r.sc==='SC'?'SAFETY CAR':'VIRTUAL SAFETY CAR'}</div>`:''}${r.pm?`<div class="bn" style="background:var(--ac);color:#fff">${r.pm}</div>`:''}${fast?`<div class="fastest"><b>Fastest Lap saat ini</b><br>${fast.name} (${fast.teamName}) · ${fmt(fast.time)} · Lap ${fast.lap}</div>`:`<div class="card"><small>Fastest lap akan muncul setelah lap hijau pertama.</small></div>`}<div class="card"><b>Peta lintasan</b> <small>posisi mobil saat melewati garis start/finish</small>${trkSvg(r.ci,"rm",0)}</div>${strategyManagementPanel(r)}${r.lap?'':`<div class="card"><b>Briefing strategi</b><br><small>Peluang hujan ${r.fc}%, kondisi lintasan sekarang: ${['kering','basah ringan','basah deras'][r.wt]}. Jika balapan tetap kering dari start sampai finis, tiap mobil wajib memakai 2 jenis ban kering (S/M/H) atau terkena penalti 20 detik. Begitu hujan turun, kewajiban dua compound kering otomatis dibatalkan. Sisa ban ditampilkan dalam persen dan berkurang setiap lap.</small></div>`}${pc}<div class="sc"><table class="tb"><tr><th>P</th><th>Pembalap</th><th>Interval</th><th>Gap</th><th>Last Lap</th><th>Best Lap</th><th>Ban</th><th>Sisa</th></tr>${timing}</table></div><div class="card"><b>Pesan race</b>${r.log.map(x=>`<br><small>${x}</small>`).join('')||'<br><small>Belum ada kejadian.</small>'}</div><div class="raceScrollPad"></div>${dock}`}


const PH={};try{Object.assign(PH,JSON.parse(sg('f1s_ph')))}catch(e){}
let hT=null;
function trkPath(ci){let q=ci*9301+49297;const rn=()=>(q=(q*9301+49297)%233280)/233280,n=9+ci%4,pt=[];for(let i=0;i<n;i++){const a=i/n*6.283,r=58+rn()*40+(i%2?-14:10);pt.push([100+Math.cos(a)*r,70+Math.sin(a)*r*.62])}
 const f=v=>v.toFixed(1);let d='M'+f(pt[0][0])+' '+f(pt[0][1]);for(let i=0;i<n;i++){const a=pt[(i-1+n)%n],b=pt[i],c=pt[(i+1)%n],e=pt[(i+2)%n];d+='C'+f(b[0]+(c[0]-a[0])/6)+' '+f(b[1]+(c[1]-a[1])/6)+' '+f(c[0]-(e[0]-b[0])/6)+' '+f(c[1]-(e[1]-b[1])/6)+' '+f(c[0])+' '+f(c[1])}return d+'Z'}
const trkSvg=(ci,id,an)=>{const d=trkPath(ci);return `<svg ${id?`id="${id}" `:''}viewBox="0 0 200 140" class="trk"><path d="${d}" fill="none" stroke="var(--tx)" stroke-width="${an?5.5:6.5}" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="var(--pn)" stroke-width="2" stroke-linejoin="round"/>${an?`<circle r="4.5" fill="var(--ac)" stroke="#fff" stroke-width="1.5"><animateMotion dur="7s" repeatCount="indefinite" path="${d}"/></circle>`:''}<g class="dg"></g></svg>`};
function dots(){const s=document.getElementById('rm');if(!s||!RS)return;const pa=s.querySelector('path'),len=pa.getTotalLength(),run=RS.cars.filter(c=>!c.x).sort((a,b)=>a.tot-b.tot),L=run[0];if(!L)return;
 s.querySelector('.dg').innerHTML=run.map((c,j)=>{const u=(1-((c.tot-L.tot)/RS.ref)%1)%1,q=pa.getPointAtLength(u*len),me=c.t===S.me;return `<circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="${me?4.5:3}" fill="${TM[c.t].k}" stroke="${me?'#fff':'none'}" stroke-width="1.5"/>${me||j==0?`<text x="${(q.x+5).toFixed(1)}" y="${(q.y-5).toFixed(1)}" font-size="8" font-weight="700" fill="var(--tx)">${j==0?'P1 ':''}${me?c.n:''}</text>`:''}`}).join('')}
const av=(n,k,sz=26)=>PH[n]?`<img class="av" src="${PH[n]}" alt="" style="width:${sz}px;height:${sz}px">`:`<span class="av" style="--k:${k};width:${sz}px;height:${sz}px">${n.split(' ').map(w=>w[0]).join('').slice(0,2)}</span>`;
function upPh(n,inp){const f=inp.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=96;const m=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/3,m,m,0,0,96,96);PH[n]=c.toDataURL('image/jpeg',.8);ss('f1s_ph',JSON.stringify(PH));render()};im.src=fr.result};fr.readAsDataURL(f)}
function delPh(n){delete PH[n];ss('f1s_ph',JSON.stringify(PH));render()}
const phCard=()=>`<div class="card"><b>Foto pembalap</b><br><small>Foto asli pembalap tidak bisa disertakan di game ini, jadi pembalap memakai avatar warna tim. Unggah foto sendiri untuk menggantinya (otomatis dipotong persegi dan diperkecil).</small><div class="phg">${TM.flatMap(t=>t.d.map(d=>[d[0],t.k])).map(([n,k])=>`<div class="phr">${av(n,k,34)}<span>${n}</span><label class="btn2 sm">Foto<input type="file" accept="image/*" hidden onchange="upPh('${n}',this)"></label>${PH[n]?`<button class="btn2 sm" onclick="delPh('${n}')">Hapus</button>`:''}</div>`).join('')}</div></div>`;
const vHome=()=>{if(hT==null)hT=Math.random()*30|0;const o=[1,4,7,10,13,16].map(k=>(hT+k)%30);return `<div class="hero"><div class="home"><div class="chk"></div><div class="h logo">F1</div><div class="h sub">SIMULATOR 2026</div><button class="btn" onclick="go('team')">▶ Play</button><button class="btn2" onclick="go('set')">⚙ Settings</button><button class="btn2" onclick="go('sv')">💾 Save / Load</button><small>11 tim, 30 sirkuit, 17 sampai 30 race per musim</small><div class="chk"></div></div><div class="trkBox"><div class="trkBig">${trkSvg(hT,'',1)}<div class="h" style="text-align:center;font-size:20px">${C[hT].n}</div><small style="display:block;text-align:center">${C[hT].c}</small></div><div class="trkGrid">${o.map(i=>`<button onclick="hT=${i};render()">${trkSvg(i,'',0)}<small>${C[i].n}</small></button>`).join('')}</div></div></div>`};
applyTheme();render();
</script></body></html>
